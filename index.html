<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --bg:#f2f4f6; --card:#ffffff; --fill:#f2f4f6; --fill2:#f9fafb; --line:#e5e8eb; --line2:#d1d6db;
    --ink:#191f28; --ink2:#333d4b; --muted:#6b7684; --muted2:#8b95a1;
    --p:#7820e8; --p-dark:#5b12b8; --p-soft:#f1e9ff; --p-soft2:#e4d4ff; --p-ink:#4a0fa3;
    --green:#0fa958; --green-soft:#e6f8ee; --green-ink:#0b7a40;
    --lime:#e6f8ee; --lime-ink:#0b7a40; --amber:#fff4d6; --amber-ink:#8a5a00; --blue-soft:#e8f3ff; --blue-ink:#1b64da;
    --danger:#f04452; --danger-soft:#fdecec;
    --r:20px; --r2:14px; --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.2,.36,1); --dur:.42s; --tab-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;
       font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
  input,select,textarea{font:inherit;color:var(--ink)} a{color:inherit}
  b,strong{font-weight:700}

  .app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg)}
  .stage{position:relative;flex:1;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);overscroll-behavior-y:contain;
        padding:calc(16px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 28px);will-change:transform,opacity;
        transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
        box-shadow:-12px 0 32px rgba(25,31,40,.16)}
  .view.enter{transform:translateX(100%) scale(.98);opacity:.85}
  .view.under{transform:translateX(-30%) scale(.96);opacity:.55}
  .view.under::after{content:'';position:absolute;inset:0;background:rgba(25,31,40,.18);pointer-events:none}
  .view.fade-in{animation:tabin .34s var(--spring) both}
  .view.fade-out{animation:tabout .18s ease both}
  @keyframes tabin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes tabout{to{opacity:0;transform:scale(.985)}}
  .view.anim .card,.view.anim .item,.view.anim .hello,.view.anim .list{animation:rise .42s var(--spring) both}
  .item:nth-child(2){animation-delay:.03s}.item:nth-child(3){animation-delay:.06s}.item:nth-child(4){animation-delay:.09s}.item:nth-child(5){animation-delay:.12s}
  .item:nth-child(6){animation-delay:.15s}.item:nth-child(7){animation-delay:.18s}.item:nth-child(8){animation-delay:.21s}
  .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .view.anim .stats button{animation:pop .5s var(--spring) both}
  .stats button:nth-child(2){animation-delay:.04s}.stats button:nth-child(3){animation-delay:.08s}.stats button:nth-child(4){animation-delay:.12s}
  .stats button:nth-child(5){animation-delay:.16s}.stats button:nth-child(6){animation-delay:.2s}.stats button:nth-child(7){animation-delay:.24s}.stats button:nth-child(8){animation-delay:.28s}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .view.anim .pill{animation:pillin .4s var(--spring) both}
  @keyframes pillin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .view.anim .code-badge{animation:pop .5s var(--spring) both}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  .view.has-back{padding-top:calc(16px + env(safe-area-inset-top))}
  .fback{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;
         background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(25,31,40,.10);display:flex;align-items:center;justify-content:center;
         z-index:6;opacity:0;pointer-events:none;transform:scale(.8);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s,transform .35s var(--spring)}
  .fback.on{opacity:1;pointer-events:auto;transform:none}
  .ptr{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));width:78px;height:40px;background:transparent;
       display:flex;align-items:center;justify-content:center;z-index:7;opacity:0;transform:translate(-50%,-14px);pointer-events:none;overflow:hidden}
  .ptr .logo,.ptr .slogo{width:46px;height:13px;display:block;transform:scale(.7);opacity:.5;transition:transform .2s var(--spring),opacity .2s}
  .ptr .slogo{width:auto;height:16px}
  .ptr.ready .logo,.ptr.ready .slogo{transform:none;opacity:1} .ptr.spin .logo,.ptr.spin .slogo{opacity:1;transform:none}
  /* SWAP 로고: 로딩 때 S·w·a·p 가 한 글자씩 위에서 떨어져 통 튀고, 순서대로 사라지기를 반복 */
  .logo{fill:var(--p);overflow:visible}
  .logo .l{transform-box:fill-box;transform-origin:center bottom}
  @keyframes letterdrop{0%{transform:translateY(-32px);opacity:0}22%{transform:translateY(2px);opacity:1}32%{transform:translateY(-1.5px)}40%{transform:translateY(0)}72%{transform:translateY(0);opacity:1}88%{transform:translateY(12px);opacity:0}100%{transform:translateY(12px);opacity:0}}
  .loadlogo .logo .l,.ptr.spin .logo .l,.loadlogo .slogo .l,.ptr.spin .slogo .l{animation:letterdrop 1.7s cubic-bezier(.3,1.3,.6,1) infinite}
  .loadlogo .l:nth-child(2),.ptr.spin .l:nth-child(2){animation-delay:.11s}
  .loadlogo .l:nth-child(3),.ptr.spin .l:nth-child(3){animation-delay:.22s}
  .loadlogo .l:nth-child(4),.ptr.spin .l:nth-child(4){animation-delay:.33s}
  .loadlogo .l:nth-child(5),.ptr.spin .l:nth-child(5){animation-delay:.44s}
  /* SWING 로고: 글자별 PNG(검정)를 원래 위치에 배치 */
  .slogo{position:relative;display:inline-block;height:29px;vertical-align:middle} .slogo .l{position:absolute;height:auto;display:block;transform-origin:center bottom}
  .loadlogo .slogo{height:36px} .hello .slogo{height:30px;margin-right:2px}
  .loadlogo{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 22px;overflow:hidden}
  .loadlogo .logo{width:104px;height:29px}
  .loadlogo span{margin-top:14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .fback:active{background:#fff;transform:scale(.88)}
  .ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 18px;min-height:42px}
  .ptitle .rt{flex:0 0 auto}
  .hbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:-.2px;
        box-shadow:0 8px 18px rgba(120,32,232,.28);transition:transform .25s var(--spring),box-shadow .2s}
  .hbtn:active{transform:scale(.94);box-shadow:0 3px 8px rgba(120,32,232,.2)}
  .hbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .view.anim .hbtn{animation:pop .5s var(--spring) .1s both}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 8px;scrollbar-width:none} .days::-webkit-scrollbar{display:none}
  .days button{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:#fff;font-weight:600;font-size:14px;color:var(--ink2);box-shadow:0 1px 3px rgba(25,31,40,.04);transition:all .2s var(--spring)}
  .days button b{margin-left:5px;color:var(--muted);font-weight:700} .days button.on{background:var(--ink);color:#fff} .days button.on b{color:rgba(255,255,255,.7)}
  .days button:active{transform:scale(.93)}
  .tl{margin:0;padding:0;list-style:none}
  .tl li{display:flex;gap:12px;padding:13px 4px;border-top:1px solid var(--fill);align-items:flex-start}
  .tl li:first-child{border-top:0}
  .tl .tm{flex:0 0 46px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;color:var(--ink2);padding-top:1px}
  .tl .dt{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted2)}
  .tl .dt.a-등록{background:var(--p)} .tl .dt.a-상태변경{background:#3182f6} .tl .dt.a-수정,.tl .dt.a-출고기기수정{background:#f5a524} .tl .dt.a-태그해제{background:var(--green)}
  .tl .bd{flex:1;min-width:0} .tl .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px} .tl .ds{font-size:13.5px;color:var(--muted);margin-top:1px}
  .tl .sn{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted2);margin-left:6px}
  .brk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .brk span{background:var(--fill);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2)} .brk span b{color:var(--ink);margin-left:3px}
  .view.anim .tl li{animation:rise .42s var(--spring) both}
  .tl li:nth-child(2){animation-delay:.03s}.tl li:nth-child(3){animation-delay:.06s}.tl li:nth-child(4){animation-delay:.09s}.tl li:nth-child(5){animation-delay:.12s}.tl li:nth-child(6){animation-delay:.15s}.tl li:nth-child(7){animation-delay:.18s}.tl li:nth-child(n+8){animation-delay:.21s}
  .ptitle.indent{padding-left:54px}
  .ptitle h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
  .ptitle .sub{font-size:14.5px;color:var(--muted);margin-top:3px;font-weight:500}
  .hello{margin:6px 4px 18px}
  .hello .date{font-size:14px;color:var(--muted);font-weight:600}
  .hello h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .hello .hlogo{display:inline-flex;align-items:center} .hello .hlogo .logo{width:96px;height:27px;display:block}
  .view.anim .hello .logo .l{animation:letterin .6s var(--spring) both}
  .hello .logo .l:nth-child(2){animation-delay:.08s} .hello .logo .l:nth-child(3){animation-delay:.16s} .hello .logo .l:nth-child(4){animation-delay:.24s}
  @keyframes letterin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

  /* 하단 메뉴: 불투명 + 테마색을 은은하게 (SWAP 보라 / SWING 검정). 고른 탭 아이콘은 테마색(--p)으로 선 안쪽만 채움
     (선 두께는 안 고른 때와 같게 — 두꺼워지면 집 문·톱니 구멍·네모 사이 틈이 좁아짐, v10.19) */
  .tabbar{--tabbg:#f6effd;--tabline:#e9dbfb;height:var(--tab-h);flex:0 0 auto;display:flex;background:var(--tabbg);
          border-top:1px solid var(--tabline);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  body.swing .tabbar{--tabbg:#ededee;--tabline:#dcdcdf}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#98a1ab;transition:color .15s}
  .tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .tabbar button.on{color:var(--p)} .tabbar button.on svg{fill:currentColor;animation:tabpop .4s var(--spring)}
  .tabbar button[data-tab="me"].on svg circle{fill:var(--tabbg)}   /* 톱니 가운데 구멍은 비움 */
  .tabbar button:active svg{transform:scale(.85)}
  @keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:none}}

  .card{background:var(--card);border-radius:var(--r);padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(25,31,40,.03)}
  .card h3{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.3px}
  .card .more{font-size:13.5px;font-weight:600;color:var(--muted)}
  .sum{padding:22px 20px 18px}
  .sum .lb{font-size:14px;color:var(--muted);font-weight:600}
  .sum .big{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .sum .big b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15}
  .sum .big span{font-size:18px;font-weight:700;color:var(--ink2)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .stats button{background:var(--fill2);border-radius:14px;padding:12px 6px 10px;text-align:center;color:var(--ink);transition:transform .25s var(--spring),background .15s}
  .stats button:active{transform:scale(.93);background:var(--fill)}
  .stats button span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .stats button b{display:block;font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.6px;line-height:1.2}
  .stats button.hot{background:var(--p);color:#fff} .stats button.hot span{color:rgba(255,255,255,.85)}
  .stats button.wide{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:6px} .stats button.wide b{margin:0}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  .dot.s-입고{background:var(--p)} .dot.s-수리대기{background:#f5a524} .dot.s-수리가능{background:#3182f6} .dot.s-재고{background:var(--green)} .dot.s-출고대기중{background:#14b8a6}
  .dot.s-출고준비완료{background:var(--green)} .dot.s-출고완료{background:var(--muted2)} .hot .dot{background:#fff}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
       background:var(--p);color:#fff;text-decoration:none;letter-spacing:-.2px;
       transition:transform .25s var(--spring),opacity .15s,background .15s}
  .btn:active{transform:scale(.96);opacity:.9}
  .btn.dark{background:var(--ink)}
  .btn.line{background:var(--fill);color:var(--ink2)}
  /* SWING 서버 테마: 보라 대신 검정 */
  body.swing{--p:#111318;--p-dark:#000;--p-soft:#e9eaef;--p-soft2:#d9dbe3;--p-ink:#111318}
  body.swing .hbtn{box-shadow:0 8px 18px rgba(0,0,0,.22)} body.swing .hbtn:active{box-shadow:0 3px 8px rgba(0,0,0,.18)}
  body.swing .hr.on{box-shadow:0 8px 18px rgba(0,0,0,.22)} body.swing .rcard:not(.lock){box-shadow:0 0 0 2px var(--p),0 10px 26px rgba(0,0,0,.14)}
  body.swing .swgrid .ph .ov{background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 3px #111318} body.swing .swgrid .ph.on .ov::after{background:#111318}
  body.swing .selbar .ok,body.swing .hbtn[style*="4a154b"]{background:#111318 !important}
  .btn.ghost{background:var(--p-soft);color:var(--p-ink)}
  .btn.green{background:var(--green)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.sm{padding:13px 14px;font-size:15px;width:auto;flex:1;border-radius:14px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:8px;margin-top:12px}
  .field{margin-bottom:10px} .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .input{width:100%;padding:15px 16px;border-radius:var(--r2);border:0;background:var(--fill);outline:none;transition:box-shadow .15s,background .15s;font-weight:500}
  .input::placeholder{color:var(--muted2)}
  .input:focus{background:#fff;box-shadow:0 0 0 2px var(--p)}
  .input.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;font-weight:700;font-size:20px;text-transform:uppercase;text-align:center}
  .muted{color:var(--muted);font-size:14px}
  .empty{text-align:center;padding:36px 10px;color:var(--muted2);font-size:14.5px;line-height:1.6}
  /* 스켈레톤 로딩 */
  @keyframes rot{to{transform:rotate(360deg)}}
  .sk{background:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:14px;animation:rise .4s var(--spring) both}
  .sk:nth-child(2){animation-delay:.06s} .sk:nth-child(3){animation-delay:.12s} .sk:nth-child(4){animation-delay:.18s}
  .sk i,.sk s{display:block;border-radius:8px;background:linear-gradient(90deg,#f2f4f6 25%,#e8ebef 37%,#f2f4f6 63%);background-size:400% 100%;animation:shim 1.4s ease infinite}
  .sk i{height:14px;margin-top:10px} .sk i.t{height:20px;width:45%;margin-top:0} .sk i.w6{width:60%} .sk i.w8{width:85%}
  .sk .r{display:flex;gap:12px;align-items:center;margin-top:14px} .sk .r s{flex:0 0 48px;height:48px;border-radius:16px} .sk .r div{flex:1} .sk .r div i:first-child{margin-top:0}
  @keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

  .code-badge{display:inline-flex;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:3px;
              background:var(--p-soft);color:var(--p-ink);padding:7px 12px 7px 14px;border-radius:12px}
  .pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:-.1px;white-space:nowrap}
  .s-입고{background:var(--p-soft);color:var(--p-ink)}
  .s-수리대기{background:var(--amber);color:var(--amber-ink)}
  .s-수리가능{background:var(--blue-soft);color:var(--blue-ink)}
  .s-재고{background:var(--lime);color:var(--lime-ink)}
  .s-출고대기중{background:#dcf7f2;color:#0b6e63}


  /* ---- SWING (S&P 워크) ---- */
  .swbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swbtns button{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;min-height:104px;padding:14px;border-radius:20px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.3px;text-align:left;box-shadow:0 8px 22px rgba(25,31,40,.12);transition:transform .25s var(--spring)}
  .swbtns button:active{transform:scale(.96)} .swbtns button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .swbtns button small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:-4px}
  .view.anim .swbtns button{animation:pop .5s var(--spring) both}
  .lb{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px}
  .swsrch .input{padding-right:54px} .swsrch .qrbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;border-radius:12px} .swsrch .qrbtn svg{position:static;left:auto;top:auto;transform:none;width:26px;height:26px;stroke:none;fill:none} .swsrch .qrbtn:active{transform:translateY(-50%) scale(.9)}
  /* 기기 카드: 누르면 오른쪽에서 어드민 접속 버튼이 나옴 */

/* ================= 일련번호 QR·바코드 실시간 스캔 ================= */
/* 기기·박스에 붙은 QR이나 바코드를 카메라에 비추면 바로 읽어 일련번호 칸에 넣는다 (예전: 사진 찍어서 읽기 → 사진은 안 될 때만).
   BarcodeDetector(안드로이드 크롬 등)가 있으면 QR + 1차원 바코드 전부. 없으면 QR은 jsQR, 바코드는 ZXing(필요할 때만 불러옴).
   읽은 글자는 사진으로 읽을 때와 똑같이 그대로 넣음. 바코드는 잘못 읽는 걸 막으려고 같은 값이 두 번 연속 나와야 넣음 */
var SS_FORMATS=['qr_code','code_128','code_39','code_93','codabar','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','pdf417','aztec'];
var ssDetP=null, zxP=null, zxFailAt=0, zxReader=null, ss=null, camPick=0;   // ss = 스캔 중 {target, stream, raf, last, track} · camPick = 사진을 실제로 골랐나
function ssDetector(){ if(ssDetP) return ssDetP; if(!('BarcodeDetector' in window)) return (ssDetP=Promise.resolve(null));
  ssDetP=Promise.resolve(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():SS_FORMATS).then(function(f){
    var use=SS_FORMATS.filter(function(x){ return f.indexOf(x)>=0; }); return use.length?new BarcodeDetector({formats:use}):null; }).catch(function(){ return null; });
  return ssDetP; }
/* ZXing 은 필요할 때 한 번만 불러옴. 실패하면 10초 동안은 다시 안 부름 (끊긴 곳에서 스크립트를 계속 붙이지 않게) */
function loadZX(){ if(zxP) return zxP; if(Date.now()-zxFailAt<10000) return Promise.resolve(null);
  zxP=new Promise(function(res){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=function(){ res(window.ZXing||null); }; s.onerror=function(){ s.remove(); zxP=null; zxFailAt=Date.now(); res(null); }; document.head.appendChild(s); });
  return zxP; }
function zxDecode(cv){ var Z=window.ZXing; if(!Z) return null;
  try{ if(!zxReader){ zxReader=new Z.MultiFormatReader(); var h=new Map(), F=Z.BarcodeFormat; h.set(Z.DecodeHintType.TRY_HARDER,true);
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.QR_CODE,F.CODE_128,F.CODE_39,F.CODE_93,F.CODABAR,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.ITF,F.DATA_MATRIX,F.PDF_417]); zxReader.setHints(h); }
    var r=zxReader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));   // decode(bitmap) 는 힌트를 지움 → decodeWithState
    return r?{text:r.getText(),qr:r.getBarcodeFormat()===Z.BarcodeFormat.QR_CODE}:null; }
  catch(e){ return null; } finally{ try{ if(zxReader) zxReader.reset(); }catch(e){} } }
/* 한 장에서 QR·바코드 읽기 → Promise({text, qr}) 또는 null.
   src = 비디오(또는 캔버스) 전체, cv = 읽을 부분의 캔버스, opt.box = 안내 네모(src 픽셀) — 있으면 네모 안에 있는 것만 인정, opt.wait = ZXing 을 불러올 때까지 기다림(사진) */
function ssDecode(src,cv,opt){ opt=opt||{}; return ssDetector().then(function(det){
    if(!det) return {det:null,r:null};
    return det.detect(src).then(function(c){ var b=opt.box, pick=null;
      (c||[]).forEach(function(d){ if(pick||!d||!d.rawValue) return; var bb=d.boundingBox; if(b&&bb){ var cx=bb.x+bb.width/2, cy=bb.y+bb.height/2; if(cx<b.x||cx>b.x+b.w||cy<b.y||cy>b.y+b.h) return; } pick=d; });
      return {det:det,r:pick?{text:pick.rawValue,qr:pick.format==='qr_code'}:null}; }).catch(function(){ return {det:det,r:null}; }); })
  .then(function(x){ if(x.r) return x.r;
    if(x.det&&opt.box) return null;   // 브라우저 기능이 있으면 그걸로 충분 (네모 안에 없음)
    var q=decodeCanvas(cv); if(q) return {text:q,qr:true};
    if(!x.det){ if(window.ZXing) return zxDecode(cv); var p=loadZX(); return opt.wait?p.then(function(){ return zxDecode(cv); }):null; }   // 불러오는 동안에도 QR은 계속 읽음
    return null; }); }
/* 화면의 안내 네모(.ssframe)를 비디오 픽셀 좌표로 (object-fit:cover 로 잘린 부분 고려, 가장자리 여유 6%) */

  x=Math.max(0,x); y=Math.max(0,y); return {x:x,y:y,w:Math.max(1,Math.min(vw-x,w)),h:Math.max(1,Math.min(vh-y,h))}; }

    var tr=stream.getVideoTracks()[0]; me.track=tr; try{ if(tr.getCapabilities&&tr.getCapabilities().torch){ swTrack=tr; var tb=$('sstorch'); if(tb) tb.style.display=''; } }catch(e){}
    msg('QR이나 바코드를 네모 안에 비추세요');

    (it.outTag?'<div class="note" style="margin:0 0 12px">이 고객요청은 이미 출고 QR <b>'+esc(it.outTag)+'</b>이 있어요.</div>':'')+
    '<div class="row" style="margin-top:0"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm dark" onclick="closeSheet(function(){ smGo('+i+',false); })">출고준비완료로 매칭</button></div>'); }
function smGo(i,force){ var v=smView(); if(!v) return; var it=(v.state.res&&v.state.res.items||[])[i]; if(!it) return; var code=v.params.code;
  var task={reqId:it.reqId,subId:it.subId||'',name:it.name||'',type:it.type||'',date:it.date||'',model:it.model||'',color:it.color||'',changeModel:it.changeModel||'',changeColor:it.changeColor||''};
  v.el.innerHTML=title('고객 매칭','')+spin('매칭 중');
  run('matchStockToTask',code,task,worker,!!force).then(function(res){ var here=smView()===v;
    if(!res.ok){ if(!here){ toast(res.error); return; } smDraw(v); if(res.needConfirm){ openSheet('<h3>이미 출고 기기가 있는 고객요청</h3><p>'+esc(res.error).replace(/\n/g,'<br>')+'</p><div class="row" style="margin-top:0"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm" onclick="closeSheet(function(){ smGo('+i+',true); })">그래도 매칭</button></div>'); } else toast(res.error); return; }
    haptic([12,40,18]);
    stack.forEach(function(x){ if(x.name==='tag'&&x.params.code===code){ x.state.tag=res.tag; x._tagDrawn=false; drawTag(x); } });   // 이 기기 상세가 열려 있으면 새 정보로 (화면을 떠났어도)
    if(here) pop(); else toast(code+' 매칭 완료 · 전산 매칭 확인 중');   // 기기 상세로 돌아가서
    setTimeout(function(){ bubble('어드민 작업을 먼저 진행해주세요!',1200).then(function(){ verifyMatchNow(true,code,res.warn); }); },here?420:0); })   // 확인은 이 기기(code)로 — 그 사이 다른 화면으로 가도
    .catch(function(e){ if(smView()===v){ smDraw(v); toast('매칭 실패: '+(e&&e.message||e)); } }); }
/* 어드민 고객요청 상세의 출고 기기가 이 기기(code)인지 확인. auto = 매칭 직후, warn = 모델이 다를 때 알림 (결과 창에 같이) → Promise(결과) */
function verifyMatchNow(auto,code,warn){ if(!code){ var v0=tagView(); if(!v0) return Promise.resolve(null); code=v0.params.code; } if(!auto) haptic(8);
  toast('어드민 고객요청 확인 중…');
  return run('verifyStockMatch',code).then(function(r){ $('toast').classList.remove('on');
    if(r.tag) stack.forEach(function(x){ if(x.name==='tag'&&x.params.code===code){ x.state.tag=r.tag; drawTag(x); } });   // 이 기기 상세(열려 있으면)를 새 결과로
    var t=r.tag||{}, wl=warn?'<div class="note" style="margin:0 0 12px">'+esc(warn)+'</div>':'';
    if(!r.ok){ if(wl) openSheet('<h3>확인해 주세요</h3>'+wl+'<button class="btn" onclick="closeSheet()">확인</button>'); toast(r.error||'확인 실패'); return r; }
    if(r.match){ haptic([12,40,18]);
      if(wl) openSheet('<h3>✓ 전산 매칭 확인</h3><p>어드민 고객요청 출고 기기가 이 기기예요.</p>'+wl+'<button class="btn" onclick="closeSheet()">확인</button>');
      else toast('✓ 전산 매칭 확인 — 어드민 출고 기기가 이 기기예요'); return r; }
    haptic([150,120,150]);
    openSheet('<h3>⚠️ 전산 매칭 안됨</h3><p>QR <b>'+esc(code)+'</b> · '+esc(t['고객명']||'')+'<br>어드민 고객요청 <b class="mono">'+esc(t['고객요청ID']||'')+'</b>의 출고 기기가 '+(r.adminSerial?'<b class="mono">'+esc(r.adminSerial)+'</b> 예요 (이 기기 아님).':'아직 없어요.')+'<br>어드민에서 이 기기(<b class="mono">'+esc(t['일련번호']||'')+'</b>)를 배정한 뒤 <b>전산 매칭 다시 확인</b>을 눌러 주세요. 15분마다 자동으로도 확인해요.</p>'+wl+
      (t.taskUrl?'<a class="btn" style="text-decoration:none" href="'+esc(t.taskUrl)+'" target="_blank" rel="noopener" onclick="closeSheet()">어드민 작업 상세 열기</a>':'<button class="btn" onclick="closeSheet()">확인</button>'));
    return r; })
    .catch(function(e){ toast('확인 실패: '+(e&&e.message||e)); return null; }); }
function unmatchAsk(){ var v=tagView(); if(!v) return; var t=v.state.tag||{};
  openSheet('<h3>재고로 되돌릴까요?</h3><p>'+esc(t['고객명'])+' '+esc(t['고객요청ID'])+' 매칭을 취소하고 원래대로('+esc(t.originText||'재고')+') 돌려요.</p><div class="row" style="margin-top:0"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm dark" onclick="closeSheet(function(){ unmatchGo(false); })">재고로 되돌리기</button></div>'); }
function unmatchGo(force){ needWorker(function(){ var v=tagView(); if(!v) return; var code=v.params.code; v.el.innerHTML=spin('되돌리는 중');
  run('unmatchStock',code,worker,!!force).then(function(res){ if(tagView()!==v) return; if(res.ok){ v.state.tag=res.tag; drawTag(v); toast('재고로 되돌렸어요'); return; } drawTag(v);
    if(res.needConfirm) openSheet('<h3>어드민에도 배정돼 있어요</h3><p>'+esc(res.error).replace(/\n/g,'<br>')+'</p><div class="row" style="margin-top:0"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm dark" onclick="closeSheet(function(){ unmatchGo(true); })">그래도 되돌리기</button></div>');
    else toast(res.error); }).catch(function(e){ v.el.innerHTML=errBox(e); }); }); }

/* ================= 등록 위저드 ================= */
/* 단계 (등록 안 된 QR을 찍었을 때): 1 출고/수거/재고 → 2 작업 선택(출고·수거) 또는 재고 기기 찾기(재고) → 3 일련번호 → 4 액세서리 → 5 특이사항 → 등록
   검색에서 기기를 골라 온 경우(params.item): 2 출고/수거/재고 → 3 … (예전 그대로) */
VIEWS.register={ render:function(v){ v.refresh=function(){ if(v.state.step===1&&!v.params.item) return loadList(v,v.state.date,true); };
  v.state.step=0; v.state.date=todayISO(0); v.state.selected=null; v.state.kind=v.params.kind||null; v.state.serial=''; v.state.frame=''; v.state.acc=''; v.state.note=''; v.state.dev=null;
  if(v.params.item){ v.state.list=[v.params.item]; v.state.selected=0; if(!v.params.item.reqId) v.state.dev={ok:false}; toStep2(); return; }
  drawKindFirst(v); getWorkListCached(v.state.date).catch(function(){}); }};   // 고르는 동안 작업리스트를 미리 받아 둔다
function regView(){ var v=stack[stack.length-1]; return (v&&v.name==='register')?v:null; }
function drawKindFirst(v){ reanim(v); v.state.step=0; var k=v.state.kind;
  var h=title('<span class="code-badge">'+esc(v.params.code)+'</span>','1/5 · 이 QR을 붙일 기기는?')+stepsBar(1);
  h+='<div class="card"><div class="kindpick three">'+
    '<button class="out '+(k==='출고'?'on':'')+'" onclick="kindFirst(\'출고\')"><div class="ic">📦</div><b>출고 기기</b><span>고객에게 나가는 기기</span></button>'+
    '<button class="'+(k==='입고'?'on':'')+'" onclick="kindFirst(\'입고\')"><div class="ic">🔧</div><b>수거 기기</b><span>고객에게서 회수한 기기</span></button>'+
    '<button class="stock '+(k==='재고'?'on':'')+'" onclick="kindFirst(\'재고\')"><div class="ic">🏷️</div><b>재고 기기</b><span>창고 보관 기기<br>반납 기기 포함</span></button></div>'+
    '<p class="muted" style="margin:12px 0 0">출고·수거는 다음에 작업을 고르고, 재고는 고객 이름이나 일련번호로 기기를 찾아요.</p></div>';
  v.el.innerHTML=h; }
function kindFirst(k){ var v=regView(); if(!v) return; haptic(8); v.state.kind=k; v.state.serial=''; v.state.frame=''; v.state.dev=null; v.state.selected=null;
  if(k==='재고') drawStockFind(v); else loadList(v,v.state.date); }
/* 목록에서 작업을 고른 뒤: 출고/수거를 이미 골랐으면 바로 일련번호, 아니면(예전 흐름) 출고/수거 고르기 */
function goFromList(){ var v=regView(); if(!v) return; if(v.state.kind&&!v.params.item) toStep3(); else toStep2(); }
function step3Back(){ var v=regView(); if(!v) return; var f=$('f_serial'); if(f) v.state.serial=f.value;
  if(v.params.item) drawStep2(v); else if(v.state.kind==='재고') drawStockFind(v); else drawStep1(v); }
/* 작업이 고른 구분과 안 맞아 보이면 알려줌 (예: 해지 건인데 출고) */
function kindHint(it,k){ var g=it.stock?'재고':(/주문|재배송/.test(it.type||'')?'출고':(/해지|철회|대차 진행 X/.test(it.type||'')?'입고':null));
  return (g&&k&&g!==k)?'<div class="note" style="margin:10px 0 0">이 작업은 보통 <b>'+kindName(g)+'</b> 기기만 있어요. 맞는지 확인하세요.</div>':''; }

/* ---- 재고 기기 찾기 (QR 먼저 찍고 재고를 고른 경우): 고객 이름 → 이용·반납 기기 / 일련번호 → 어드민 기기 / 직접 입력 ---- */
function drawStockFind(v){ reanim(v); v.state.step='s';
  var h=title('<span class="code-badge">'+esc(v.params.code)+'</span>','2/5 · 어떤 재고 기기인가요?')+stepsBar(2);
  h+='<div class="card"><div class="lb">고객 이름 또는 일련번호</div><div class="row" style="margin:6px 0 0"><input class="input" id="sf_q" value="'+esc(v.state.sq||'')+'" placeholder="예: 홍길동, S9-1-1504" autocomplete="off" style="flex:1">'+
    '<button class="btn sm" style="flex:0 0 auto;padding:0 18px" onclick="stockFindGo()">찾기</button></div>'+
    '<p class="muted" style="margin:10px 0 0;font-size:13px">이름으로 찾으면 그 고객이 쓰던 기기를 <b>이용 중 · 반납</b>으로 나눠 보여줘요. 창고에 들어온 <b>반납</b> 기기를 고르세요.</p></div>'+
    '<div id="sf_res"></div>'+
    '<button class="btn line" style="margin-bottom:10px" onclick="stockManual()">일련번호 직접 입력</button>'+
    '<div class="row"><button class="btn line sm" onclick="drawKindFirst(regView())">이전</button></div>';
  v.el.innerHTML=h; $('sf_q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.target.blur(); stockFindGo(); } });
  if(v.state.sres) stockFindDraw(v); else setTimeout(function(){ var i=$('sf_q'); if(i&&regView()===v) i.focus(); },350); }
function looksSerialQ(q){ return /[0-9]/.test(q)&&/^[A-Za-z0-9\-]+$/.test(q); }
function stockFindGo(){ var v=regView(); if(!v) return; var q=(($('sf_q')||{}).value||'').trim(); if(q.length<2){ toast('2글자 이상 입력해 주세요'); return; }
  v.state.sq=q; var seq=v.state.sseq=(v.state.sseq||0)+1; $('sf_res').innerHTML=spin('어드민에서 찾는 중'); haptic(6);
  (looksSerialQ(q) ? run('searchAdmin',q).then(function(a){ return {kind:'serial',a:a}; }) : run('adminCustomerDevices',q,'').then(function(r){ return {kind:'name',r:r}; }))
    .then(function(res){ if(regView()!==v||v.state.sseq!==seq||v.state.step!=='s') return; v.state.sres=res; stockFindDraw(v); })
    .catch(function(e){ if(regView()===v&&v.state.sseq===seq&&$('sf_res')) $('sf_res').innerHTML=errBox(e); }); }
function stockFindDraw(v){ var res=v.state.sres, box=$('sf_res'); if(!box||!res) return;
  if(res.kind==='name'){ box.innerHTML=cdHtml(res.r); return; }
  var a=res.a||{}; var items=(a.items||[]).filter(function(it){ return it.serial; });
  box.innerHTML=!a.ok?'<div class="card"><p class="muted" style="margin:0">어드민 검색 불가 — '+esc(a.error||'')+'</p></div>':
    (!items.length?'<div class="card"><p class="muted" style="margin:0">어드민에 그 일련번호가 없어요. 직접 입력으로 등록할 수 있어요.</p></div>':
    '<div class="list">'+items.map(function(it,i){ return '<button class="item" onclick="stockPickSerial('+(a.items.indexOf(it))+')">'+devAv(it.model,it.color)+'<div class="bd"><div class="nm"><span class="sn" style="margin:0">'+esc(it.serial)+'</span>'+(it.stock?'<span class="chip gray">미배정</span>':'')+'</div>'+
      '<div class="sub">'+esc([it.model,it.color].filter(Boolean).join(' '))+(it.name?' · '+esc(it.name):'')+'</div><div class="sub">'+esc(it.type||'')+'</div></div></button>'; }).join('')+'</div>'); }
function stockPickSerial(i){ var v=regView(); if(!v||!v.state.sres||!v.state.sres.a) return; var it=v.state.sres.a.items[i]; if(!it) return;
  stockChoose(v,{reqId:'',subId:it.subId||'',name:it.name||'재고',type:'재고 등록',model:it.model||'',color:it.color||'',serial:it.serial,frame:it.frame||'',stock:true,kind:'재고',source:'admin'}); }
function stockManual(){ var v=regView(); if(!v) return; stockChoose(v,{reqId:'',name:'재고',type:'재고 등록',model:'',color:'',serial:'',stock:true,kind:'재고'}); }
function stockChoose(v,item){ haptic(8); v.state.list=[item]; v.state.selected=0; v.state.kind='재고'; v.state.dev={ok:false}; v.state.serial=item.serial||''; v.state.frame=item.frame||''; drawStep3(v); }

/* ---- 고객 기기 (이용 중 · 반납): 어드민 고객요청에서 기기마다 마지막 출고/수거를 보고, 기기 목록 상태로 한 번 더 확인 ---- */
/* 누른 줄은 지금 맨 위 화면이 가진 결과에서 찾는다 (등록 2단계: state.sres.r / 고객 기기 화면: state.r) — 다른 화면의 결과와 섞이지 않게 */
function cdResTop(){ var v=stack[stack.length-1]; if(!v) return null; if(v.name==='register') return v.state.step==='s'&&v.state.sres&&v.state.sres.r; if(v.name==='custdev') return v.state.r; return null; }
function cdChip(d){ return d.role==='return'?'<span class="chip" style="background:#e6f7ec;color:#1f6b3a">반납</span>':(d.role==='use'?'<span class="chip p">이용 중</span>':'<span class="chip gray">다른 고객</span>'); }
function cdHtml(r){ if(!r||!r.ok) return '<div class="card"><p class="muted" style="margin:0">어드민 검색 불가 — '+esc((r&&r.error)||'')+'</p></div>';
  if(!r.customers.length) return '<div class="card"><p class="muted" style="margin:0">그 이름으로 찾은 기기가 없어요. 일련번호로 찾거나 직접 입력해 주세요.</p></div>';
  return r.customers.map(function(c,gi){ var nr=c.devices.filter(function(d){ return d.role==='return'; }).length;
    return '<div class="sec"><span>'+esc(c.name||'이름 없음')+'</span><span>반납 '+nr+' · 전체 '+c.devices.length+'대</span></div><div class="list">'+c.devices.map(function(d,di){ var tg=d.tag&&!d.tag.out;
      return '<button class="item'+(d.role==='return'?'':' cdoff')+'" onclick="cdPick('+gi+','+di+')">'+devAv(d.model,d.color)+'<div class="bd">'+
        '<div class="nm"><span class="sn" style="margin:0">'+esc(d.serial)+'</span>'+cdChip(d)+(tg?'<span class="chip gray">QR '+esc(d.tag.code)+'</span>':'')+'</div>'+
        '<div class="sub">'+esc([d.model,d.color].filter(Boolean).join(' '))+' · '+esc(d.label)+(d.state?' · '+esc(d.state):'')+'</div>'+
        '<div class="sub">'+esc(d.type||'')+(d.date?' · '+esc(d.date):'')+'</div></div>'+
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>'; }).join('')+'</div>'; }).join('')+
    '<p class="muted" style="margin:0 6px 14px;font-size:12.5px">반납 = 고객에게서 수거된 기기(창고에 들어온 기기). 이용 중 = 어드민에 아직 고객이 쓰는 기기로 나오는 기기.</p>'; }
function cdPick(gi,di){ var r=cdResTop(), c=r&&r.customers&&r.customers[gi], d=c&&c.devices[di]; if(!d) return;
  if(d.tag&&!d.tag.out){ openSheet('<h3>이미 QR에 등록된 기기</h3><p><b class="mono">'+esc(d.serial)+'</b> 는 QR <b>'+esc(d.tag.code)+'</b>('+esc(d.tag.status)+')에 등록돼 있어요.</p>'+
      '<button class="btn" onclick="closeSheet(function(){ push(\'tag\',{code:\''+jsa(d.tag.code)+'\'}); })">그 QR 보기</button>'); return; }
  if(d.role==='return'){ cdUse(gi,di); return; }
  openSheet('<h3>'+(d.role==='use'?'지금 이용 중인 기기예요':'다른 고객이 쓰는 기기예요')+'</h3><p><b class="mono">'+esc(d.serial)+'</b> · '+esc(d.label)+'<br>'+(d.role==='use'?'어드민에는 '+esc(c.name||'고객')+' 님이 지금 쓰는 기기로 나와요.':'어드민에는 다른 고객 기기로 나와요.')+' 실제로 창고에 들어온 기기가 맞을 때만 재고로 등록하세요.</p>'+
    '<div class="row" style="margin-top:0"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm dark" onclick="closeSheet(function(){ cdUse('+gi+','+di+',\''+jsa(d.serial)+'\'); })">그래도 재고로</button></div>'); }
function cdUse(gi,di,serial){ var r=cdResTop(), c=r&&r.customers&&r.customers[gi], d=c&&c.devices[di];
  if(!d||(serial&&d.serial!==serial)){ toast('목록이 바뀌었어요. 다시 골라 주세요'); return; }   // 확인 창을 띄운 사이 목록이 새로 그려진 경우
  var item={reqId:'',subId:c.subId||'',name:c.name||'재고',type:(d.role==='return'?'반납 기기 재고 등록':'재고 등록'),model:d.model||'',color:d.color||'',serial:d.serial,frame:d.frame||'',stock:true,kind:'재고',source:'admin'};
  var v=regView(); if(v&&v.state.step==='s'){ stockChoose(v,item); return; }
  matchQR(item); }
VIEWS.custdev={ render:function(v){ var q=v.params.q; v.refresh=function(){ return cdLoad(v); };

/* ---- SerialExtractor (원본 규칙 그대로) ---- */
var SW_SERIAL_KEYS=['code','serial','sn','qrcode','qr','deviceid','imei'], SW_WRAP_KEYS=['link','url','target','redirect'];
var SW_STOP={RIDE:1,SCAN:1,S:1,R:1,QR:1,APP:1,HOME:1,INDEX:1,START:1,OPEN:1,DOWNLOAD:1}; var SW_SHAPE=/^[A-Z0-9][A-Z0-9_-]{3,23}$/;
function swUrlDecode(v){ try{ return decodeURIComponent(String(v).replace(/\+/g,'%20')); }catch(e){ return v; } }
function swParseQuery(text){ var i=text.indexOf('?'); if(i<0) return {}; var q=text.slice(i+1); var h=q.indexOf('#'); if(h>=0) q=q.slice(0,h); var out={}; if(!q) return out;
  q.split('&').forEach(function(p){ var e=p.indexOf('='); var k=(e<0?'':p.slice(0,e)).toLowerCase().trim(), v=(e<0?'':p.slice(e+1)).trim(); if(k&&v) out[k]=v; }); return out; }
function swLastSeg(text){ var t=text.split('?')[0].split('#')[0].replace(/\/+$/,''); var s=t.slice(t.lastIndexOf('/')+1); return s||null; }
function swSanitize(v){ var d=swUrlDecode(v).trim(); var s=''; for(var i=0;i<d.length;i++){ var c=d[i]; if(/[\p{L}\p{N}]/u.test(c)||c==='-'||c==='_') s+=c; } return s?s.toUpperCase():null; }
function swLooksSerial(v){ return SW_SHAPE.test(v)&&!SW_STOP[v]; }
function swExtract(raw,depth){ depth=depth||0; var text=String(raw||'').trim(); if(!text) return null; var params=swParseQuery(text);
  if(depth<3){ for(var i=0;i<SW_WRAP_KEYS.length;i++){ var w=params[SW_WRAP_KEYS[i]]; if(w){ var r=swExtract(swUrlDecode(w),depth+1); if(r) return r; } } }
  for(var j=0;j<SW_SERIAL_KEYS.length;j++){ var sv=params[SW_SERIAL_KEYS[j]]; if(sv){ var s=swSanitize(sv); if(s) return s; } }
  var seg=swLastSeg(text); var cand=seg?swSanitize(seg):null; if(cand&&swLooksSerial(cand)) return cand;
  var ks=Object.keys(params); for(var k=0;k<ks.length;k++){ var c2=swSanitize(params[ks[k]]); if(c2&&swLooksSerial(c2)) return c2; }
  return cand; }

function swStamp(cv,lines){ var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height; var short=Math.min(W,H); var margin=.035*short; var size=.065*short;
  ctx.font='bold '+size+'px sans-serif'; var widest=0; lines.forEach(function(l){ widest=Math.max(widest,ctx.measureText(l).width); });
  var maxW=W*.8-margin; if(widest>maxW){ size*=maxW/widest; ctx.font='bold '+size+'px sans-serif'; }
  var lh=1.28*size; var m=ctx.measureText('Ag'); var desc=(m.actualBoundingBoxDescent||size*.22);
  var y=H-margin-desc-(lines.length-1)*lh; ctx.lineJoin='round'; ctx.lineWidth=.13*size; ctx.strokeStyle='#000'; ctx.fillStyle='#fff'; ctx.textBaseline='alphabetic';
  lines.forEach(function(l){ ctx.strokeText(l,margin,y); ctx.fillText(l,margin,y); y+=lh; }); }

/* 서버(Swing.gs)가 어드민 "킥보드 전체 기록"에서 관리자가 등록한 작업자의 기록만 모아, 작업자·기기마다 분류해서 준다:
   재배치수거됨+배터리 교체+배치됨 = 교체 후 재배치 / 배터리 교체만 = 배터리 교체 / 재배치수거됨+배치됨 = 재배치 / 재배치수거됨만 = 고장수거 OR 재배치수거됨 / 배치됨만 = 배치.
   같은 기기는 한 번만. 교체·재배치·배치 뒤 배터리가 60% 미만(v10.18 전 날짜는 40%, 서버 lowBat)이면 작업 불량_확인필요, 교체 때 오프라인이면 오프라인 확인(90% 이상 정산 반영 · 50% 미만 작업 불량 의심 · 그 사이 확인 대기).
   야간(v10.18): 전날 20시 이후 작업이 있는 작업자의 새벽 0~8시 기록은 전날 작업일로 (타일 시각 "익일 01:30").
   작업자 세부에서 QR 을 누르면 말풍선: 어드민 열기 + (고장수거OR재배치수거됨) 고장수거·작업 불량 / (오프라인 확인) 작업 불량·기기이상 수거해야함 / (확인필요) 작업 불량·정상
   → 고른 기기는 아래 줄 "고장수거"·"작업 불량" 탭으로 옮겨 가고 작업현황 정산에 반영. 고장수거 탭은 어드민 상태로 처리예정(고장·미수거)·처리완료(창고) 딱지.
   홈 = 작업내역 간단 보고(어제 기본, 오늘~7일 전, 7일 그래프). 추가기능 → 작업자 작업내역 = 작업자 고르기 → 필터 → 작업자 세부(슬랙 전송·내용 복사 = 확인).
   아직 안 받은 날짜는 서버가 10초씩 받아 {pending, progress}를 주고, 여기서 이어서 호출한다. */
var SW_CATS=[['swap','배터리 교체'],['swapRe','교체 후 재배치'],['re','재배치'],['fault','고장수거 OR 재배치수거됨'],['place','배치']], SW_CHECK='작업 불량_확인필요', SW_MODELS=['S9','W9','I9'];
var SW_OFF='오프라인 확인', SW_OFF_TXT={ok:'정산 반영',wait:'확인 대기',bad:'작업 불량 의심'}, SW_JUDGE={broken:'고장수거',mistake:'작업 불량',device:'기기이상 수거해야함',ok:'정상'}, SW_JUDGE_RO={broken:'고장수거로',mistake:'작업 불량으로',device:'기기이상 수거해야함으로',ok:'정상으로'};
var SW_PROC={wait:'처리예정',done:'처리완료'};   // 고장수거 탭 딱지: 어드민 고장·미수거 = 처리예정, 창고 = 처리완료
var SW_ADMIN='https://adminweb.theswing.co.kr/#/app/scoot/';   // 어드민 기기 상세 (서버 SWING_ADMIN_WEB 과 같음)
var SW_CAT_COLOR={swap:'#2a78d6',swapRe:'#eb6834',re:'#1baf7a',fault:'#eda100',place:'#e87ba4'};   // 7일 그래프 분류 색 (색약 검증된 순서)
var swDayMem={};   // {date:{t,res}} 작업자 작업내역·세부가 같이 쓰는 캐시 (2분)
function swWorkMin(){ return todayISO(-365); }
function swIsDayView(v){ return v&&(v.name==='sw_work'||v.name==='sw_wd'); }
/* 작업자가 바뀌면 캐시를 비우고, 열려 있는 작업내역·세부는 맨 위면 바로, 아래 깔려 있으면 돌아올 때 다시 불러오게 */
function swWorkInvalidate(){ swDayMem={}; var top=stack[stack.length-1];
  stack.forEach(function(v){ if(swIsDayView(v)){ if(v===top) swDayLoad(v,v.state.date,true); else v.state.stale=true; } else if(v.name==='home'&&SERVER==='swing') v.state.stale=true; }); }
function swWorkProg(v,p){ var s=v.el.querySelector('.loadlogo > span:not(.slogo)'); if(s) s.textContent='어드민 기록 받는 중 · '+Math.max(1,Math.min(99,Math.round((p||0)*100)))+'%'; }
function swDayLabel(iso){ var t=todayISO(0), y=todayISO(-1); if(iso===t) return '오늘'; if(iso===y) return '어제'; var p=iso.split('-'); return (+p[1])+'/'+(+p[2]); }
function swCatBrk(c){ var h=SW_CATS.filter(function(x){ return c[x[0]]; }).map(function(x){ return '<span>'+x[1]+'<b>'+c[x[0]]+'</b></span>'; }).join('');
  if(c.check) h+='<span class="ck">⚠️'+SW_CHECK+'<b>'+c.check+'</b></span>'; return h?'<div class="brk">'+h+'</div>':''; }

/* ---- 홈: 작업내역 간단 보고 (어제 기본 · 오늘~7일 전 · 7일 그래프) ---- */
VIEWS.sw_home={ render:function(v){ reanim(v); if(!v.state.date){ v.state.date=todayISO(-1); v.state.auto=true; }   // 어제 기준 (auto = 사용자가 날짜를 안 고름)
  v.refresh=function(){ if(swHomeRoll(v)) return Promise.resolve(); return swHomeLoad(v,true); };
  v.onResume=function(){ if(swHomeRoll(v)) return; if(v.state.stale){ v.state.stale=false; swHomeLoad(v,true); } else swHomeDraw(v); };
  swHomeLoad(v,false); }};
/* 앱을 켜 둔 채 자정이 지나면 "어제"를 새 어제로 (사용자가 다른 날짜를 골랐으면 그대로) */
function swHomeRoll(v){ if(!v.state.auto||v.state.date===todayISO(-1)) return false; v.state.date=todayISO(-1); resetCount(v); swHomeLoad(v,false); return true; }
document.addEventListener('visibilitychange',function(){ if(document.hidden) return; var v=stack[stack.length-1]; if(v&&v.name==='home'&&SERVER==='swing'&&stack.length===1) swHomeRoll(v); });
function swHomeDays(v){ var d=v.state.date, h='<div class="days">';
  for(var i=0;i<=7;i++){ var x=todayISO(-i); h+='<button class="'+(x===d?'on':'')+'" onclick="swHomeGo(\''+x+'\')">'+swDayLabel(x)+'</button>'; }
  return h+'</div>'; }
function swHomeGo(date){ var v=stack[stack.length-1]; if(!v||v.name!=='home'||SERVER!=='swing'||v.state.date===date) return; haptic(6); v.state.date=date; v.state.auto=(date===todayISO(-1)); resetCount(v); swHomeLoad(v,false); }
function swHomeHead(v){ return '<div class="hello"><div class="date"><span class="hlogo">'+LOGO_SWING+'</span> 스윙과사람들 작업</div><h1 class="swt">작업내역 간단 보고</h1></div>'+swHomeDays(v); }
/* 폰에 저장해 둔 마지막 결과를 먼저 그리고(바로 뜸), 뒤에서 서버 결과로 바꾼다 */
function swHomeLoad(v,quiet){ var date=v.state.date, tok=v.state.tok=(v.state.tok||0)+1, cached=lsGet('sw_home:'+date), steps=0, fails=0, later=0;
  if(cached&&cached.date===date){ v.state.res=cached; swHomeDraw(v); }
  else if(!quiet||!v.state.res||v.state.res.date!==date){ v.state.res=null; v.el.innerHTML=swHomeHead(v)+spin('작업내역을 불러오는 중'); }
  function alive(){ return stack.indexOf(v)>=0&&v.state.tok===tok; }
  function fail(e){ if(!alive()) return; if(v.state.res){ toast('새로고침 실패: '+(e&&e.message||e)); return; }
    v.el.innerHTML=swHomeHead(v)+errBox(e)+'<button class="btn line" onclick="swHomeLoad(stack[stack.length-1],false)">다시 시도</button>'; }
  function step(){ if(++steps>40) return fail(new Error('기록을 받는 데 너무 오래 걸려요. 잠시 뒤 다시 열어 주세요.'));
    return run('swingWorkHome',date).then(function(res){ if(!alive()) return;
      if(!res||res.ok===false) return fail(new Error(res&&res.error||'서버 오류'));
      if(res.pending){ fails=0; if(!v.state.res){ swWorkProg(v,res.progress); } return step(); }
      lsSet('sw_home:'+date,res); var same=v.state.res&&JSON.stringify(v.state.res)===JSON.stringify(res); v.state.res=res; if(!same) swHomeDraw(v,!!cached||later>0);
      if((res.week||[]).some(function(x){ return x.later; })&&++later<=3) return step(); })   // 서버가 시간이 모자라 못 묶은 날 → 한 번 더 (이미 묶은 날은 캐시라 금방)
    .catch(function(e){ if(!alive()) return; if(e&&e.auth===false) return; if(++fails<=2) return step(); return fail(e); }); }
  return step(); }
function swHomeDraw(v,quiet){ if(!quiet) reanim(v); var res=v.state.res; if(!res){ return; } var d=v.state.date, admin=!!(AUTH&&AUTH.admin), h=swHomeHead(v);
  if(res.noWorkers){ v.el.innerHTML=h+'<div class="card"><div class="empty">아직 등록된 작업자가 없어요.<br>'+(admin?'추가기능 → 작업자 관리에서 컬렉터 아이디를 넣어 주세요.':'관리자에게 작업자 등록을 요청해 주세요.')+'</div>'+
    (admin?'<button class="btn" onclick="push(\'sw_workers\',{})">작업자 관리</button>':'')+'</div>'; return; }
  var day=res.day||{}, c=day.cats||{};
  h+='<div class="card sum"><div class="lb">'+swDayLabel(d)+' 작업 합계'+(day.updated?' · '+esc(day.updated)+' 기준':'')+'</div>'+
    '<div class="big">'+num(day.total||0,'swh')+'<span>건</span></div>'+swCatBrk(c)+
    (day.unconfirmed?'<div class="swwarn" style="margin-top:12px">⚠️ 작업내역 미확인 '+day.unconfirmed+'명</div>':(day.busy?'<div class="swok" style="margin-top:12px">✓ 모두 확인했어요</div>':''))+
    (can('swing.sw_work')?'<button class="btn line" style="margin-top:14px" onclick="push(\'sw_work\',{date:\''+d+'\'})">작업자별 자세히 보기 ›</button>'
      :'<button class="btn line lockb" style="margin-top:14px" onclick="push(\'sw_work\',{date:\''+d+'\'})">'+LOCK_I+' 작업자별 자세히 보기</button>')+'</div>';   // 작업자 작업내역 권한이 없으면 push 가 막고 안내
  h+=swWeekCard(res.week||[]);
  v.el.innerHTML=h; if(!quiet) countUp(v.el); }
/* 7일 요약 그래프: 날짜별 쌓은 막대(분류 5개), 위에 합계, 아래 날짜. 막대를 누르면 그 날 내역 */
function swWeekCard(week){ if(!week.length) return '';
  var done=week.filter(function(x){ return x.done; }), tot=done.reduce(function(s,x){ return s+(x.total||0); },0);
  var avg=done.length?Math.round(tot/done.length):0, best=done.slice().sort(function(a,b){ return (b.total||0)-(a.total||0); })[0];
  var max=Math.max.apply(null,[1].concat(done.map(function(x){ return x.total||0; })));
  var W=340,H=190,top=22,bot=28,pl=4,pr=4,n=week.length,slot=(W-pl-pr)/n,bw=Math.min(30,slot*0.56),ph=H-top-bot;
  var svg='<svg class="wk7" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 7일 작업 건수">';
  svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(top+ph)+'" y2="'+(top+ph)+'" class="ax"/>';
  week.forEach(function(x,i){ var cx=pl+slot*i+slot/2, x0=cx-bw/2, lab=swDayLabel(x.date);
    if(!x.done){ svg+='<rect x="'+x0+'" y="'+(top+ph-26)+'" width="'+bw+'" height="26" rx="4" class="nd"/><text x="'+cx+'" y="'+(top+ph-32)+'" class="tl s">'+(x.later?'불러오는 중':'수집 전')+'</text>'; }
    else { var y=top+ph, segs=SW_CATS.filter(function(c){ return x.cats&&x.cats[c[0]]; });
      segs.forEach(function(c,k){ var hgt=(x.cats[c[0]]/max)*ph, last=(k===segs.length-1); y-=hgt;
        var hh=Math.max(0,hgt-(last?0:2)), yy=y+(last?0:2);   // 칸 사이 2px 띄움
        svg+=last ? '<path d="'+swBarTop(x0,yy,bw,hh)+'" fill="'+SW_CAT_COLOR[c[0]]+'"/>' : '<rect x="'+x0+'" y="'+yy+'" width="'+bw+'" height="'+hh+'" fill="'+SW_CAT_COLOR[c[0]]+'"/>'; });
      svg+='<text x="'+cx+'" y="'+(Math.min(top+ph,y)-6)+'" class="tl">'+(x.total||0)+'</text>'; }
    svg+='<text x="'+cx+'" y="'+(H-8)+'" class="dl">'+lab+'</text>';
    svg+='<rect x="'+(pl+slot*i)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent" onclick="swWeekTap('+i+')" style="cursor:pointer"/>'; });
  svg+='</svg>';
  var h='<div class="card"><h3>최근 7일</h3><div class="wkst"><div><span>7일 합계</span><b>'+tot.toLocaleString()+'</b></div><div><span>하루 평균</span><b>'+avg.toLocaleString()+'</b></div>'+
    '<div><span>최고일'+(best?' · '+swDayLabel(best.date):'')+'</span><b>'+(best?best.total.toLocaleString():'-')+'</b></div></div>'+svg+
    '<div class="wklg">'+SW_CATS.map(function(c){ return '<span><i style="background:'+SW_CAT_COLOR[c[0]]+'"></i>'+c[1]+'</span>'; }).join('')+'</div>'+
    '<div class="wktip" id="wktip">막대를 누르면 그 날 내역이 보여요</div>'+
    (week.some(function(x){ return !x.done&&!x.later; })?'<p class="muted" style="margin:8px 0 0;font-size:12px">"수집 전"인 날은 15분 자동 수집이 곧 채워요.</p>':'')+'</div>';
  window._swWeek=week; return h; }
function swBarTop(x,y,w,h){ var r=Math.min(4,h,w/2); return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'; }
function swWeekTap(i){ var x=(window._swWeek||[])[i], el=$('wktip'); if(!x||!el) return; haptic(6);
  el.innerHTML=!x.done?'<b>'+fmtDateK(x.date)+'</b> · '+(x.later?'불러오는 중이에요':'아직 수집 전이에요'):'<b>'+fmtDateK(x.date)+' · '+x.total+'건</b><br>'+SW_CATS.map(function(c){ return '<span><i style="background:'+SW_CAT_COLOR[c[0]]+'"></i>'+c[1]+' '+(x.cats[c[0]]||0)+'</span>'; }).join('')+(x.cats.check?'<span class="ck">⚠️'+SW_CHECK+' '+x.cats.check+'</span>':''); }

/* ---- 추가기능 → 작업자 작업내역: 들어오면 작업자 고르기 → 필터(작업자·기종·확인 상태) + 날짜 → 작업자 세부 ---- */
VIEWS.sw_work={ render:function(v){ reanim(v); v.state.date=v.state.date||v.params.date||todayISO(-1); v.state.keys=v.state.keys||[]; v.state.fm=v.state.fm||'all'; v.state.fs=v.state.fs||'all';
  v.refresh=function(){ return swDayLoad(v,v.state.date,true); };
  v.onResume=function(){ if(v.state.stale||!swDayMem[v.state.date]){ v.state.stale=false; swDayLoad(v,v.state.date,false); } else { v.state.res=swDayMem[v.state.date].res; swWorkDraw(v,true); } };
  swDayLoad(v,v.state.date,false);   // 작업자를 고르는 동안 뒤에서 미리 받아 둔다
  if(!v.state.picked){ v.state.picked=true; setTimeout(function(){ if(stack[stack.length-1]===v&&!(v.state.res&&v.state.res.noWorkers)) swPickOpen(v); },250); } }};
function swWorkHead(v){ return title('작업자 작업내역',fmtDateK(v.state.date))+swWorkFilters(v); }
function swWorkFilters(v){ var ks=v.state.keys, ro=lsGet('sw_roster')||[], nm=function(k){ var r=ro.filter(function(x){ return x.key===k; })[0]; return r?r.name:'?'; };
  var who=!ks.length?'전체 작업자':(ks.length===1?nm(ks[0]):nm(ks[0])+' 외 '+(ks.length-1)+'명');
  var h='<div class="wfbar"><button class="wfwho" onclick="swPickOpen(stack[stack.length-1])"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg><span>'+esc(who)+'</span><i>▾</i></button>'+
    '<div class="seg mseg wfm">'+['all'].concat(SW_MODELS).map(function(m){ return '<button class="'+(v.state.fm===m?'on':'')+'" onclick="swWorkFm(\''+m+'\')">'+(m==='all'?'전체':m)+'</button>'; }).join('')+'</div>'+
    '<div class="chips wfs">'+[['all','전체'],['un','미확인'],['ok','확인함']].map(function(s){ return '<button class="'+(v.state.fs===s[0]?'on':'')+'" onclick="swWorkFs(\''+s[0]+'\')">'+s[1]+'</button>'; }).join('')+'</div></div>';
  var d=v.state.date, days=[]; for(var i=0;i<=7;i++) days.push(todayISO(-i)); if(days.indexOf(d)<0) days.push(d);
  h+='<div class="days">'+days.map(function(x){ return '<button class="'+(x===d?'on':'')+'" onclick="swWorkGo(\''+x+'\')">'+swDayLabel(x)+'</button>'; }).join('')+'</div>'+
    '<input type="date" class="input" style="margin-bottom:12px" value="'+esc(d)+'" min="'+swWorkMin()+'" max="'+todayISO(0)+'" onchange="swWorkGo(this.value)">';
  return h; }
function swWorkView(){ var v=stack[stack.length-1]; return (v&&v.name==='sw_work')?v:null; }
function swWorkGo(date){ var v=swWorkView(); if(!v||!date) return;
  if(date<swWorkMin()||date>todayISO(0)){ toast('최근 1년 안의 날짜만 볼 수 있어요'); var inp=v.el.querySelector('input[type=date]'); if(inp) inp.value=v.state.date; return; }
  if(date===v.state.date&&v.state.res&&v.state.res.date===date) return;
  haptic(6); resetCount(v); swDayLoad(v,date,false); }
function swWorkFm(m){ var v=swWorkView(); if(!v||v.state.fm===m) return; haptic(6); v.state.fm=m; if(v.state.drawn) swWorkDraw(v,true); else v.el.querySelector('.wfbar').outerHTML=swWorkFilters(v).split('<div class="days">')[0]; }
function swWorkFs(s){ var v=swWorkView(); if(!v||v.state.fs===s) return; haptic(6); v.state.fs=s; if(v.state.drawn) swWorkDraw(v,true); else v.el.querySelector('.wfbar').outerHTML=swWorkFilters(v).split('<div class="days">')[0]; }
/* 기종 필터를 적용한 작업자별 개수·분류 */
function swWorkRows(v){ var ws=(v.state.res&&v.state.res.workers)||[], ks=v.state.keys, fm=v.state.fm, fs=v.state.fs;
  return ws.filter(function(w){ return !ks.length||ks.indexOf(w.key)>=0; }).map(function(w){
    var ts=(w.tasks||[]).filter(function(t){ return fm==='all'||(t.m||'기타')===fm; }), c={swap:0,swapRe:0,re:0,fault:0,place:0,check:0};
    ts.forEach(function(t){ c[t.c]++; if(t.low&&!t.j) c.check++; }); return {w:w,count:ts.length,cats:c}; })
    .filter(function(r){ return fs==='all'||(fs==='un'?!r.w.confirmed:!!r.w.confirmed); }); }
function swWorkDraw(v,quiet){ if(!quiet) reanim(v); var res=v.state.res||{}, d=v.state.date, admin=!!(AUTH&&AUTH.admin);
  var h=swWorkHead(v);
  if(res.noWorkers){ v.el.innerHTML=h+'<div class="card"><div class="empty">아직 등록된 작업자가 없어요.<br>'+(admin?'작업자 관리에서 컬렉터 아이디를 넣어 주세요.':'관리자에게 작업자 등록을 요청해 주세요.')+'</div>'+
    (admin?'<button class="btn" onclick="push(\'sw_workers\',{})">작업자 관리</button>':'')+'</div>'; v.state.drawn=true; return; }
  var rows=swWorkRows(v), busy=rows.filter(function(r){ return r.count; }), idle=rows.filter(function(r){ return !r.count; });
  var tot=0, c={swap:0,swapRe:0,re:0,fault:0,place:0,check:0}; busy.forEach(function(r){ tot+=r.count; Object.keys(c).forEach(function(k){ c[k]+=r.cats[k]; }); });
  var un=busy.filter(function(r){ return !r.w.confirmed; }).length;
  h+='<div class="card sum"><div class="lb">'+(d===todayISO(0)?'오늘':d===todayISO(-1)?'어제':fmtDateK(d))+(v.state.fm!=='all'?' · '+esc(v.state.fm):'')+' · 작업자 '+busy.length+'명'+(res.updated?' · '+esc(res.updated)+' 기준':'')+'</div>'+
    '<div class="big">'+(quiet?'<b class="num">'+tot+'</b>':num(tot,'sww'))+'<span>건</span></div>'+swCatBrk(c)+
    (un?'<div class="swwarn" style="margin-top:12px">⚠️ 작업내역 미확인 '+un+'명</div>':'')+
    (admin&&res.workers&&res.lowBat===undefined?'<div class="swold">서버(Apps Script)가 아직 옛 버전이라 야간 작업일·60% 기준이 안 돼요. Code.gs·Swing.gs 를 붙여넣고 배포 → 배포 관리 → 새 버전으로 배포해 주세요.</div>':'')+'</div>';   // v10.18 서버는 lowBat 을 줌
  h+='<div class="card"><h3>작업자별</h3>';
  if(!busy.length) h+='<div class="empty" style="padding:18px 0">조건에 맞는 작업자 기록이 없어요.</div>';
  else {
    if(busy.some(function(r){ return r.w.confirmed; })&&!lsGet('sw_tip_off')) h+='<div class="tipb" id="swtip">회색 버튼은 슬랙 전송이나 내용 복사로 <b>확인한 작업자</b>예요. 다시 눌러서 볼 수 있어요.<button onclick="swTipOff()" aria-label="닫기">×</button></div>';
    h+='<div class="wkbtns">'+busy.map(function(r){ var w=r.w, nt=swNightTxt(w); return '<button class="wkb'+(w.confirmed?' done':'')+(nt?' hn':'')+'" onclick="swOpenWorker(\''+esc(w.key)+'\')"><b>'+esc(w.name)+'</b><span>'+r.count+'건'+(w.branch?' · '+esc(w.branch):'')+'</span>'+
      (nt?'<i class="nt"><em>야간</em><span>'+esc(nt.replace(/^야간 /,''))+'</span></i>':'')+(w.confirmed?'<i class="ck">✓ 확인</i>':'')+(r.cats.check?'<i class="lw">⚠️ '+r.cats.check+'</i>':'')+'</button>'; }).join('')+'</div>';
  }
  if(idle.length) h+='<p class="muted" style="margin:12px 2px 0;font-size:13px">기록 없음 · '+idle.map(function(r){ return esc(r.w.name); }).join(', ')+'</p>';
  h+='</div>';
  v.el.innerHTML=h; v.state.drawn=true; if(!quiet) countUp(v.el); }
function swTipOff(){ lsSet('sw_tip_off',1); var t=$('swtip'); if(t) t.remove(); }
/* 야간 작업자 표시 (서버 w.night: 그 날 20시 이후 작업이 있으면 다음 날 08시 전 작업까지 그 날로) → "야간 21:10~익일 06:40" */
function swNightTxt(w){ var n=w&&w.night; return n?'야간 '+n.t1+'~'+(n.d2?'익일 ':'')+n.t2:''; }
function swOpenWorker(key){ var v=swWorkView(); if(!v) return; push('sw_wd',{date:v.state.date,key:key,model:'all'}); }   // 목록의 기종 필터는 보기용 → 세부는 전체로 (한 기종만 보내고 전부 확인되는 일 방지)
/* 작업자 고르기 시트: 지점 탭(향남·수원) + 검색창 + 명단(스크롤) — 누르면 체크(탭을 옮겨도 유지), 아무도 안 고르고 확인 = 전체 */
function swPickOpen(v){ if(!v||v.name!=='sw_work'||sheetOpen) return; v.state.pick=(v.state.keys||[]).slice(); v.state.pq='';
  var ro=lsGet('sw_roster')||[], first=ro.filter(function(r){ return v.state.pick.indexOf(r.key)>=0; })[0];
  v.state.pb=first?swPickBr(first):(lsGet('sw_pick_b')||SW_BRANCHES[0]);   // 고른 사람이 있으면 그 지점, 아니면 마지막에 본 탭
  openSheet('<h3>누구 작업을 볼까요?</h3><p style="margin-bottom:10px">이름을 누르면 골라져요. 아무도 안 고르고 확인하면 <b>전체</b>를 봐요.</p>'+
    '<div class="seg pkseg" id="pk_tabs"></div>'+
    '<input class="input" id="pk_q" placeholder="이름 검색" autocomplete="off" oninput="swPickQ(this.value)" style="margin-bottom:10px">'+
    '<div class="pklist" id="pk_list"></div><div class="row"><button class="btn line sm" onclick="swPickAll()">전체 해제</button><button class="btn sm" style="flex:2" id="pk_ok" onclick="swPickOk()">확인</button></div>');
  swPickRoster(v); }
function swPickRoster(v){ v.state.roSt=lsGet('sw_roster')?'ok':'load'; swPickDraw(v);
  var live=function(){ return sheetOpen&&$('pk_list')&&swWorkView()===v; };   // 예전 화면에서 늦게 온 응답이 새 시트를 덮지 않게
  run('swingWorkRoster').then(function(ro){ lsSet('sw_roster',ro||[]); v.state.roSt='ok'; if(live()) swPickDraw(v); })
    .catch(function(){ if(!lsGet('sw_roster')) v.state.roSt='err'; if(live()) swPickDraw(v); }); }
function swPickRetry(){ var v=swWorkView(); if(v) swPickRoster(v); }
function swPickBr(r){ return r.branch||SW_BRANCHES[0]; }
function swPickDraw(v){ var el=$('pk_list'); if(!el) return; var ro=lsGet('sw_roster')||[], q=String(v.state.pq||'').trim().toLowerCase();
  var brs=SW_BRANCHES.slice(); ro.forEach(function(r){ if(brs.indexOf(swPickBr(r))<0) brs.push(swPickBr(r)); });   // 향남·수원 (다른 지점이 있으면 뒤에)
  if(brs.indexOf(v.state.pb)<0) v.state.pb=brs[0]; var b=v.state.pb;
  var hit=function(r){ return !q||r.name.toLowerCase().indexOf(q)>=0; };
  var tabs=$('pk_tabs'); if(tabs) tabs.innerHTML=brs.map(function(x){ var inX=ro.filter(function(r){ return swPickBr(r)===x; }), s=inX.filter(function(r){ return v.state.pick.indexOf(r.key)>=0; }).length;
    return '<button class="'+(x===b?'on':'')+'" onclick="swPickTab(\''+esc(x)+'\')">'+esc(x)+'<b>'+inX.filter(hit).length+'</b>'+(s?'<i>'+s+'</i>':'')+'</button>'; }).join('');   // 검색 중이면 탭 숫자 = 찾은 사람 수
  var list=ro.filter(function(r){ return swPickBr(r)===b&&hit(r); });
  var other=q?brs.filter(function(x){ return x!==b&&ro.some(function(r){ return swPickBr(r)===x&&hit(r); }); })[0]:'';   // 검색한 이름이 다른 지점에도 있으면 안내
  var nOther=other?ro.filter(function(r){ return swPickBr(r)===other&&hit(r); }).length:0;
  var hint=other?'<button class="btn line sm" style="margin-top:10px" onclick="swPickTab(\''+esc(other)+'\')">'+esc(other)+'에'+(list.length?'도 '+nOther+'명':'')+' 있어요 ›</button>':'';
  el.innerHTML=!ro.length?(v.state.roSt==='load'?'<div class="empty" style="padding:16px 0">명단을 불러오는 중…</div>':
      v.state.roSt==='err'?'<div class="empty" style="padding:16px 0">명단을 못 불러왔어요.<br><button class="btn line sm" style="margin-top:10px" onclick="swPickRetry()">다시 시도</button></div>':
      '<div class="empty" style="padding:16px 0">등록된 작업자가 없어요.</div>'):
    (!list.length?'<div class="empty" style="padding:16px 0">'+(q?'찾는 이름이 없어요.':esc(b)+'에 등록된 작업자가 없어요.')+(hint?'<br>'+hint:'')+'</div>':
    list.map(function(r){ var on=v.state.pick.indexOf(r.key)>=0; return '<button class="pkrow'+(on?' on':'')+'" data-k="'+esc(r.key)+'" onclick="swPickTog(this)"><i>'+(on?'✓':'')+'</i><b>'+esc(r.name)+'</b></button>'; }).join('')+
      (hint?'<div style="text-align:center;margin-bottom:6px">'+hint+'</div>':''));
  var ok=$('pk_ok'); if(ok) ok.textContent=v.state.pick.length?'확인 ('+v.state.pick.length+'명)':'확인 (전체)'; }
function swPickTab(b){ var v=swWorkView(); if(!v||v.state.pb===b) return; haptic(6); v.state.pb=b; lsSet('sw_pick_b',b); swPickDraw(v); var el=$('pk_list'); if(el) el.scrollTop=0; }
function swPickQ(q){ var v=swWorkView(); if(!v) return; v.state.pq=q; swPickDraw(v); }
function swPickTog(b){ var v=swWorkView(); if(!v) return; var k=b.getAttribute('data-k'), i=v.state.pick.indexOf(k); haptic(6); if(i>=0) v.state.pick.splice(i,1); else v.state.pick.push(k); swPickDraw(v); }
function swPickAll(){ var v=swWorkView(); if(!v) return; haptic(6); v.state.pick=[]; swPickDraw(v); }
function swPickOk(){ var v=swWorkView(); if(!v) return; var keys=v.state.pick.slice(); haptic(8);
  closeSheet(function(){ v.state.keys=keys; if(v.state.drawn) swWorkDraw(v,true); else { var bar=v.el.querySelector('.wfbar'); if(bar) bar.outerHTML=swWorkFilters(v).split('<div class="days">')[0]; } }); }

/* ---- 작업내역·세부 공통 불러오기 (swingWorkDay, 캐시 swDayMem) ---- */
function swDayHead(v){ return v.name==='sw_wd' ? title('작업자',fmtDateK(v.state.date)) : swWorkHead(v); }
function swDayDraw(v,quiet){ if(v.name==='sw_wd') swWdDraw(v,quiet); else swWorkDraw(v,quiet); }
function swDayLoad(v,date,force){ v.state.date=date; var tok=v.state.tok=(v.state.tok||0)+1; var c=swDayMem[date];
  if(!force&&c&&Date.now()-c.t<120000){ v.state.res=c.res; swDayDraw(v); return Promise.resolve(); }
  var keep=force&&v.state.drawn&&v.state.res&&v.state.res.date===date;   // 당겨서 새로고침: 지금 보이는 화면은 그대로 두고 뒤에서 받기 (로딩·오류 화면이면 keep 안 함)
  if(!keep){ swBubDrop(v); v.state.drawn=false; v.el.innerHTML=swDayHead(v)+spin('어드민 기록을 불러오는 중'); }
  var fails=0, steps=0;
  function alive(){ return stack.indexOf(v)>=0&&v.state.tok===tok; }
  function fail(e){ if(!alive()) return; if(keep){ toast(e&&e.message||'불러오기 실패'); return; }
    swBubDrop(v); v.state.drawn=false; v.el.innerHTML=swDayHead(v)+errBox(e)+'<button class="btn line" onclick="swDayLoad(stack[stack.length-1],\''+date+'\',false)">다시 시도</button>'; }
  function step(){ if(++steps>40) return fail(new Error('기록을 받는 데 너무 오래 걸려요. 잠시 뒤 다시 열어 주세요.'));
    return run('swingWorkDay',date).then(function(res){ if(!alive()) return;
      if(!res||res.ok===false) return fail(new Error(res&&res.error||'서버 오류'));
      if(res.pending){ fails=0; if(keep){ keep=false; swBubDrop(v); v.state.drawn=false; v.el.innerHTML=swDayHead(v)+spin('어드민 기록 받는 중'); } swWorkProg(v,res.progress); return step(); }   // 오래 걸리면 진행률이 보이게
      swDayMem[date]={t:Date.now(),res:res}; v.state.res=res; swDayDraw(v); })
    .catch(function(e){ if(!alive()) return; if(e&&e.auth===false) return; if(++fails<=2) return step(); return fail(e); }); }
  return step(); }

/* ---- 작업자 세부: 기종 탭(전체/S9/W9/I9) + 분류 탭 + 슬랙·복사(= 확인) ---- */
VIEWS.sw_wd={ render:function(v){ reanim(v); v.state.date=v.params.date; v.state.key=v.params.key; v.state.model=v.state.model||v.params.model||'all'; v.state.note=v.state.note||'';
  v.refresh=function(){ return swDayLoad(v,v.state.date,true); };
  v.onResume=function(){ if(v.state.stale||!swDayMem[v.state.date]){ v.state.stale=false; swDayLoad(v,v.state.date,false); } };
  var c=swDayMem[v.state.date]; if(c){ v.state.res=c.res; swWdDraw(v); var dp=v.state.date.split('-'), liveEnd=new Date(+dp[0],+dp[1]-1,+dp[2]+1,8).getTime();
    if(Date.now()-c.t>120000&&c.t<liveEnd+120000) swDayLoad(v,v.state.date,true); }   // 그 작업일이 끝나기 전(다음 날 08시, 야간)에 받아 둔 목록이고 2분 넘었으면 뒤에서 새로
  else swDayLoad(v,v.state.date,false); }};
function swWdWorker(v){ var ws=(v.state.res&&v.state.res.workers)||[]; return ws.filter(function(w){ return w.key===v.state.key; })[0]||null; }
function swWdTasks(v,w){ var m=v.state.model; return (w.tasks||[]).filter(function(t){ return m==='all'||(t.m||'기타')===m; }); }
function swBubDrop(v){ if(accBub&&accBub.sw&&accBub.sw.v===v) accBubClose(); }   // 이 화면의 QR 말풍선 닫기 (목록이 스피너·오류·"못 찾음"으로 바뀔 때)
function swWdDraw(v,quiet){ if(!quiet) reanim(v); var d=v.state.date, w=swWdWorker(v);
  if(!w){ swBubDrop(v); v.el.innerHTML=title('작업자',fmtDateK(d))+'<div class="card"><div class="empty">이 작업자를 찾을 수 없어요.<br>작업자 관리에서 빠졌을 수 있어요.</div></div>'; v.state.drawn=true; return; }
  var keepNote=$('wd_note')?$('wd_note').value:v.state.note; v.state.note=keepNote;
  var models=SW_MODELS.slice(); Object.keys(w.models||{}).forEach(function(m){ if(models.indexOf(m)<0) models.push(m); });
  if(v.state.model!=='all'&&models.indexOf(v.state.model)<0) v.state.model='all';
  // 판정한 기기는 원래 탭에서 빠져 아래 줄 탭(고장수거·작업 불량)으로 옮겨 감. 정상은 확인필요에서만 빠짐
  var ts=swWdTasks(v,w), L=swWdLists(ts), cnt={}; SW_CATS.forEach(function(c){ cnt[c[0]]=L[c[0]].length; });
  var cat=v.state.cat; if(!cat||!L[cat]){ cat=(SW_CATS.filter(function(c){ return cnt[c[0]]; })[0]||[['check','off','r_broken','r_mistake'].filter(function(k){ return L[k].length; })[0]||'swap'])[0]; v.state.cat=cat; }   // 처음에만 고름 (판정해서 빈 탭이 돼도 그 탭에 머묾)
  var h=title(esc(w.name),fmtDateK(d)+(w.branch?' · '+esc(w.branch):'')+(w.night?' · '+esc(swNightTxt(w)):''),swWdSearchBox(v));
  h+=w.confirmed?'<div class="wdst ok">✓ '+esc(w.confirmed.by||'')+' · '+esc(String(w.confirmed.at||'').slice(5))+' '+({'슬랙':'슬랙 전송으로','복사':'내용 복사로'}[w.confirmed.method]||esc(w.confirmed.method||''))+' 확인함</div>'
                :'<div class="wdst un">⚠️ 미확인 · 슬랙 전송이나 내용 복사를 하면 확인돼요</div>';
  h+='<div class="seg mseg">'+['all'].concat(models).map(function(m){ var n=m==='all'?(w.tasks||[]).length:((w.models||{})[m]||0);
    return '<button class="'+(v.state.model===m?'on':'')+(n?'':' z')+'" onclick="swWdModel(\''+esc(m)+'\')">'+(m==='all'?'전체':esc(m))+'<b>'+n+'</b></button>'; }).join('')+'</div>';
  var tb=function(k,label,n,cls){ return '<button class="'+(cls||'')+(cat===k?' on':'')+(n?'':' z')+'" onclick="swWdCat(\''+k+'\')">'+label+'<b>'+n+'</b></button>'; };
  h+='<div class="catbar">'+SW_CATS.map(function(c){ return tb(c[0],c[1],cnt[c[0]]); }).join('')+tb('check','⚠️'+SW_CHECK,L.check.length,'ck')+tb('off',SW_OFF,L.off.length,'of')+'</div>'+
    '<div class="catbar res"><span class="rl">판정한 기기</span>'+tb('r_broken',SW_JUDGE.broken,L.r_broken.length,'rb')+tb('r_mistake',SW_JUDGE.mistake,L.r_mistake.length,'rm')+'</div>';
  h+='<div id="wd_listc">'+swWdCard(v,w,ts,L,cat)+'</div>';   // QR 검색은 이 칸만 다시 그림 (입력칸은 그대로)
  h+=swWdI9Html(v,w);   // I9 작업 (슬랙으로 보내기 위)
  var pend=swWdPending(w), off=(!ts.length||v.state.sending||pend.n)?' disabled':'';   // 판정 안 한 게 남아 있으면 슬랙·복사 잠금 (기종 탭과 상관없이 그 작업자 전체)
  h+='<div class="card wdsend"><h3>슬랙으로 보내기</h3>'+(pend.n?swWdPendHtml(pend):'')+'<textarea class="input" id="wd_note" placeholder="특이사항 (없으면 비워두세요)" oninput="swWdNote(this.value)">'+esc(keepNote)+'</textarea>'+
    '<button class="btn" style="margin-top:12px" onclick="swWdSendAsk()"'+off+'><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>슬랙으로 보내기</button>'+
    '<button class="btn line" style="margin-top:8px" onclick="swWdCopy()"'+off+'>내용 복사</button>'+
    '<p class="muted" style="margin:12px 0 0;font-size:13px;text-align:center">'+(pend.n?'판정을 다 해야 보내거나 복사할 수 있어요.':(v.state.model==='all'?'전체':esc(v.state.model))+' '+ts.length+'건 · 보내거나 복사하면 확인 표시돼요.')+'</p></div>';
  var qFocus=document.activeElement&&document.activeElement.id==='wd_q';   // 검색어를 치는 중에 뒤에서 다시 그려져도 입력칸 그대로
  v.el.innerHTML=h; v.state.drawn=true;
  if(qFocus){ var qi=$('wd_q'); if(qi){ qi.focus(); try{ qi.setSelectionRange(qi.value.length,qi.value.length); }catch(e){} } }
  swWdBubSync(v); }
/* 목록 카드: 고른 탭 목록, QR 검색 중이면 이 작업자의 모든 탭에서 찾은 기기 (작은 글씨 = 그 기기가 있는 탭) */
function swWdCard(v,w,ts,L,cat){ var q=swWdQNorm(v.state.q), srch=!!q;
  var list=srch?swWdFind(w,q):L[cat], label=srch?'QR 검색 · '+esc(q):swWdLabel(cat), h='';
  h+='<div class="card"><h3 class="wkt"><span>'+label+'</span><b>'+list.length+'건</b></h3>';
  var tip=function(s){ return '<p class="muted" style="margin:-4px 0 12px;font-size:13px">'+s+'</p>'; };

function swLandscape(on){ try{ if(on){ var el=document.documentElement; var p=(el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):Promise.reject()); Promise.resolve(p).catch(function(){}).then(function(){ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }); }
  else { if(screen.orientation&&screen.orientation.unlock) try{ screen.orientation.unlock(); }catch(e){} if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(function(){}); } }catch(e){} }

function swShoot(){ var v=stack[stack.length-1]; if(!v||v.state.saving) return; var vid=$('swvid'); if(!vid||vid.readyState<2||!vid.videoWidth){ toast('카메라가 아직 준비되지 않았습니다'); swWarn(); return; }
  v.state.saving=true; var btn=$('swshut'); btn.disabled=true; btn.textContent='저장 중...'; swTick();

      var over=L.splice(SW_MAX_PHOTOS); over.forEach(function(o){ swDel(o.id); });   // 10장 넘으면 오래된 사진부터 자동 삭제
      swPhotosSave(L);
      swSuccess(); toast(over.length?'저장 완료 · 오래된 사진 '+over.length+'장 자동 삭제됨 (최대 '+SW_MAX_PHOTOS+'장)':'저장 완료 · 사진모음에서 공유'); var flash=$('swcambox'); if(flash){ flash.classList.add('flash'); setTimeout(function(){ flash.classList.remove('flash'); },300); }
      if(kind==='battery'&&swPrefs().resetCounts){ ['sw_s9','sw_w9','sw_i9'].forEach(function(i){ var e=$(i); if(e) e.value=''; }); var cb=$('sw_i9on'); if(cb&&cb.checked){ cb.checked=false; swI9Toggle(cb); } swCamPreview(); }

function swGalDraw(v){ var st=v.state; var all=swPhotos(); var shown=all.filter(function(p){ return !st.filter||p.kind===st.filter; }); Object.keys(st.sel).forEach(function(k){ if(!shown.some(function(p){ return p.id===k; })) delete st.sel[k]; });

  var g=$('swgrid'); if(g) swGalBind(v,g); }
function swGalBind(v,g){ var st=v.state; var pressT=null, downId=null, moved=false, sx=0, sy=0;
  g.addEventListener('pointerdown',function(e){ var b=e.target.closest('.ph'); if(!b) return; downId=b.dataset.id; moved=false; sx=e.clientX; sy=e.clientY; clearTimeout(pressT);

function swSharePhotos(entries,text){ toast('사진 준비 중…');

  $('lauto').checked=!!prefill;
  if(!prefill) setTimeout(function(){ try{ $('lcode').focus(); }catch(e){} },500); }
function hideLogin(){ var l=$('login'); l.classList.add('out'); setTimeout(function(){ l.style.display='none'; swingStop(); },480); }
function loginFail(msg){ lanimReset(true); var card=$('lcard'); $('glitch').classList.remove('wild'); $('lbtn').disabled=false; $('lbtn').textContent='접속'; setLoginErr(msg||'접속 실패'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
/* ---- 접속 애니메이션 (1.3초) ----
   0초: 접속 코드 칸과 접속 버튼이 밑줄로 합쳐져 선 하나 → 0.3초: 선이 "- - - -"로 바뀌어 왼쪽→오른쪽으로 흐르고, 바로 밑에 로딩바.
   0.3~1.3초: 1→100% + 옆에 단계 글 (접속코드 확인중 → 코드 권한 확인중 → 작업내역·재고 확인중 → 접속 승인).
   서버 승인이 늦으면 80%(작업내역·재고 확인중)에서 기다렸다가 승인되면 마저 채우고 들어감. 실패하면 원래 칸·버튼으로 돌아오고 흔들림 */
var LSTAGE=[[25,'접속코드 확인중'],[50,'코드 권한 확인중'],[80,'작업내역·재고 확인중'],[100,'접속 승인']];
var la=null;   // 애니메이션 중 {t0, p, ok, fin, raf, tm}
var lShown=['',''], lBackT=0;   // 화면에 찍힌 % · 단계 글 (바뀔 때만 다시 씀 → 화면낭독기가 매 프레임 읽지 않게)
function lanimSet(p){ var fl=$('lbarfill'), pc=$('lpct'), st=$('lstage'); if(!fl) return; fl.style.width=p+'%';
  var pt=Math.max(1,Math.round(p))+'%', sg=(LSTAGE.filter(function(x){ return p<=x[0]; })[0]||LSTAGE[3])[1];
  if(pt!==lShown[0]){ pc.textContent=pt; lShown[0]=pt; } if(sg!==lShown[1]){ st.textContent=sg; lShown[1]=sg; } }
/* smooth=true(실패): 칸·버튼 자리를 0.3초에 걸쳐 되돌리고, 로딩바가 다 접힌 다음에 0%로 */
function lanimReset(smooth){ if(la){ if(la.raf) cancelAnimationFrame(la.raf); if(la.tm) clearTimeout(la.tm); } la=null; clearTimeout(lBackT);
  var c=$('lcard'), f=$('lfield'), pr=$('lprog'), inp=$('lcode'); if(!c||!f) return;
  var h0=(smooth&&f.style.height)?f.offsetHeight:0;
  c.classList.remove('lgo','ldash'); pr.classList.remove('on'); pr.setAttribute('aria-hidden','true'); inp.readOnly=false; f.style.height='';
  if(!h0){ lanimSet(0); return; }
  var h1=f.offsetHeight; f.style.height=h0+'px'; void f.offsetHeight; f.style.height=h1+'px';
  lBackT=setTimeout(function(){ if(la) return; f.style.height=''; lanimSet(0); },320); }
function lanimStart(){ lanimReset(); var c=$('lcard'), f=$('lfield'), inp=$('lcode'), m=$('lmorph'), pr=$('lprog'); if(!c||!f) return;
  inp.readOnly=true;   // 접속 중엔 코드 못 고침
  var ly=inp.offsetTop+inp.offsetHeight-1; m.style.top=ly+'px'; f.style.height=f.offsetHeight+'px'; void f.offsetHeight;
  c.classList.add('lgo'); f.style.height=(ly+16)+'px';   // 접속 버튼 자리를 접어 선만 남김
  pr.classList.add('on'); pr.removeAttribute('aria-hidden');   // 로딩바 자리도 같은 0.3초에 벌림 (글은 CSS 로 0.3초 뒤에 보임)
  var me=la={t0:performance.now(),p:0,ok:null,fin:null,raf:0,tm:0,last:0};
  me.tm=setTimeout(function(){ if(la!==me) return; c.classList.add('ldash'); },300);
  me.raf=requestAnimationFrame(function tick(now){ if(la!==me) return; var dt=me.last?now-me.last:16; me.last=now;
    var tl=Math.min(100,Math.max(0,(now-me.t0-300)/10));   // 0.3초~1.3초: 0→100
    var p=me.ok ? Math.min(tl,me.p+dt*0.12) : Math.min(tl,80);   // 승인 전엔 80%에서 대기 · 늦게 승인되면 거기서부터 0.2초 안에 마저 (뛰지 않게)
    me.p=Math.min(100,Math.max(me.p,p)); lanimSet(me.p);
    if(me.ok&&me.p>=100){ var fn=me.fin; me.tm=setTimeout(function(){ if(la!==me) return; la=null; if(fn) fn(); },160); return; }
    me.raf=requestAnimationFrame(tick); }); }
function lanimDone(fn){ if(!la){ fn(); return; } la.ok=true; la.fin=fn; }
function doLogin(){ if(la||$('lbtn').disabled) return; var code=($('lcode').value||'').trim().toUpperCase(), sv=SERVER;
  if(code.length<5){ loginFail('코드는 5자리예요'); return; }
  $('lbtn').disabled=true; setLoginErr(''); $('glitch').classList.add('wild'); try{ $('lcode').blur(); }catch(e){} lanimStart();
  run('login',code,sv).then(function(a){ applyAuth(a,$('lauto').checked); lanimDone(function(){ if(SERVER!==sv) setServer(sv); $('glitch').classList.remove('wild'); if(navigator.vibrate) navigator.vibrate([10,30,10]); hideLogin(); startApp(); }); })
    .catch(function(e){ loginFail(e.message); }); }
/* 자동 로그인: 로그인 화면이 뜨고 곧바로 같은 접속 애니메이션(그동안 코드가 아직 유효한지 확인) → 들어감 */
function autoLogin(){ showLogin('',AUTH.code); $('lbtn').disabled=true; $('glitch').classList.add('wild'); var sv=SERVER;
  var started=new Promise(function(r){ setTimeout(function(){ lanimStart(); r(); },250); });   // 카드가 나타난 다음
  var check=run('login',AUTH.code,sv).then(function(a){ applyAuth(a,true); return true; }).catch(function(e){ if(e.auth===false) return e; return true; /* 네트워크 오류면 저장된 코드로 진행 */ });
  Promise.all([started,check]).then(function(r){
    if(r[1]!==true){ if(AUTH){ AUTH.auto=false; try{ localStorage.setItem('swapAuth',JSON.stringify(AUTH)); }catch(e){} }   // 코드가 막힘 → 다음부턴 자동 로그인 안 함
      $('lauto').checked=false; loginFail(r[1].message); return; }
    lanimDone(function(){ if(SERVER!==sv) setServer(sv); $('glitch').classList.remove('wild'); hideLogin(); startApp(); }); }); }
function applyAuth(a,auto){ var legacy=(a.role===undefined&&a.master===undefined);   // 서버(Code.gs)가 아직 v10.5 → 관리자 = 마스터 하나뿐
  AUTH={code:a.code,name:a.name||'',admin:!!a.admin,master:legacy?!!a.admin:!!a.master,role:a.role||(a.admin?(legacy?'master':'admin'):'worker'),auto:!!auto,
    servers:(a.servers&&a.servers.length)?a.servers:['swap','swing'],perms:a.perms||{}}; try{ localStorage.setItem('swapAuth',JSON.stringify(AUTH)); }catch(e){}
  if(a.vehicles!==undefined) vehSet(a.vehicles);   // 공용 차량 목록 (null = 아직 없음 → 폰 목록)
  if(a.name&&!a.master&&worker!==a.name){ worker=a.name; localStorage.setItem('swapWorker',a.name); } }
/* 앱으로 돌아올 때(1분 넘게 지났으면) 권한·차량 목록을 다시 받아 추가기능 화면에 바로 반영 */
var meAt=Date.now();
document.addEventListener('visibilitychange',function(){ if(document.hidden||!AUTH||!appStarted||Date.now()-meAt<60000) return; meAt=Date.now();
  run('getMe').then(function(a){ if(!a||!AUTH) return; var before=JSON.stringify([AUTH.perms,AUTH.role]); applyAuth(a,AUTH.auto);
    if(JSON.stringify([AUTH.perms,AUTH.role])===before) return;
    var v=stack[0]; if(!v) return;   // 권한이 바뀜 → 맨 아래 탭 화면(추가기능·환경설정·홈)을 새 권한으로 다시 그림
    if(v.name==='extras'||v.name==='me') viewOf(v.name).render(v);
    else if(v.name==='home'&&SERVER==='swing'&&v.state.res) swHomeDraw(v,true); }).catch(function(){}); });
function canServer(sv){ return !AUTH||!AUTH.servers||AUTH.servers.indexOf(sv)>=0; }
function switchServer(sv){ if(sv===SERVER) return; if(!canServer(sv)){ toast('이 코드는 '+sv.toUpperCase()+' 서버 권한이 없어요'); return; } haptic([10,30,10]); setServer(sv); toast((sv==='swing'?'SWING':'SWAP')+' 서버로 전환'); goTab('home'); }
var loggingOut=false;
function logout(msg){ if(loggingOut) return; loggingOut=true; AUTH=null; try{ localStorage.removeItem('swapAuth'); }catch(e){}
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('swapc:')===0) localStorage.removeItem(k); }); }catch(e){}
  var u=location.pathname+(msg?'?bye='+encodeURIComponent(msg):''); location.replace(u); }
function logoutAsk(){ openSheet('<h3>로그아웃</h3><p>다시 들어오려면 접속 코드를 입력해야 해요.</p><div class="row"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm" style="background:#d6336c" onclick="logout()">로그아웃</button></div>'); }
var appStarted=false;
function startApp(){ if(appStarted) return; appStarted=true;
  tabTo('home');
  if(CODE) push('tag',{code:CODE});
  setTimeout(prefetch, 800); }
function boot(){ try{ history.replaceState({d:0},''); }catch(e){}
  var bye=new URLSearchParams(location.search).get('bye');
  if(bye){ try{ history.replaceState({d:0},'',location.pathname); }catch(e){} }
  if(AUTH&&AUTH.code&&AUTH.auto&&!bye) autoLogin();
  else { if(AUTH&&!AUTH.auto){ AUTH=null; try{ localStorage.removeItem('swapAuth'); }catch(e){} } showLogin(bye||''); } }

/* ================= 시작 ================= */
/* PWA: 설치 프롬프트 잡아두기 + 서비스워커 등록 */
var installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; var b=$('installbtn'); if(b) b.style.display=''; });
window.addEventListener('appinstalled',function(){ installEvt=null; toast('홈 화면에 설치됐어요'); var b=$('installbtn'); if(b) b.style.display='none'; });
function installApp(){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; }); return; }
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  openSheet('<h3>홈 화면에 추가</h3><p>'+(ios?'사파리 아래 <b>공유</b> 버튼(네모에 화살표) → <b>홈 화면에 추가</b>를 누르세요.':'크롬 오른쪽 위 <b>⋮ 메뉴</b> → <b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.')+'</p><button class="btn" onclick="closeSheet()">확인</button>'); }
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

boot();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --bg:#f2f4f6; --card:#ffffff; --fill:#f2f4f6; --fill2:#f9fafb; --line:#e5e8eb; --line2:#d1d6db;
    --ink:#191f28; --ink2:#333d4b; --muted:#6b7684; --muted2:#8b95a1;
    --p:#7820e8; --p-dark:#5b12b8; --p-soft:#f1e9ff; --p-soft2:#e4d4ff; --p-ink:#4a0fa3;
    --green:#0fa958; --green-soft:#e6f8ee; --green-ink:#0b7a40;
    --lime:#e6f8ee; --lime-ink:#0b7a40; --amber:#fff4d6; --amber-ink:#8a5a00; --blue-soft:#e8f3ff; --blue-ink:#1b64da;
    --danger:#f04452; --danger-soft:#fdecec;
    --r:20px; --r2:14px; --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.2,.36,1); --dur:.42s; --tab-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;
       font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
  input,select,textarea{font:inherit;color:var(--ink)} a{color:inherit}
  b,strong{font-weight:700}

  .app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg)}
  .stage{position:relative;flex:1;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);overscroll-behavior-y:contain;
        padding:calc(16px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 28px);will-change:transform,opacity;
        transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
        box-shadow:-12px 0 32px rgba(25,31,40,.16)}
  .view.enter{transform:translateX(100%) scale(.98);opacity:.85}
  .view.under{transform:translateX(-30%) scale(.96);opacity:.55}
  .view.under::after{content:'';position:absolute;inset:0;background:rgba(25,31,40,.18);pointer-events:none}
  .view.fade-in{animation:tabin .34s var(--spring) both}
  .view.fade-out{animation:tabout .18s ease both}
  @keyframes tabin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes tabout{to{opacity:0;transform:scale(.985)}}
  .view.anim .card,.view.anim .item,.view.anim .hello,.view.anim .list{animation:rise .42s var(--spring) both}
  .item:nth-child(2){animation-delay:.03s}.item:nth-child(3){animation-delay:.06s}.item:nth-child(4){animation-delay:.09s}.item:nth-child(5){animation-delay:.12s}
  .item:nth-child(6){animation-delay:.15s}.item:nth-child(7){animation-delay:.18s}.item:nth-child(8){animation-delay:.21s}
  .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .view.anim .stats button{animation:pop .5s var(--spring) both}
  .stats button:nth-child(2){animation-delay:.04s}.stats button:nth-child(3){animation-delay:.08s}.stats button:nth-child(4){animation-delay:.12s}
  .stats button:nth-child(5){animation-delay:.16s}.stats button:nth-child(6){animation-delay:.2s}.stats button:nth-child(7){animation-delay:.24s}.stats button:nth-child(8){animation-delay:.28s}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .view.anim .pill{animation:pillin .4s var(--spring) both}
  @keyframes pillin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .view.anim .code-badge{animation:pop .5s var(--spring) both}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  .view.has-back{padding-top:calc(16px + env(safe-area-inset-top))}
  .fback{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;
         background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(25,31,40,.10);display:flex;align-items:center;justify-content:center;
         z-index:6;opacity:0;pointer-events:none;transform:scale(.8);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s,transform .35s var(--spring)}
  .fback.on{opacity:1;pointer-events:auto;transform:none}
  .ptr{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));width:78px;height:40px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 2px 12px rgba(25,31,40,.12);
       backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);border:1px solid rgba(255,255,255,.6);
       display:flex;align-items:center;justify-content:center;z-index:7;opacity:0;transform:translate(-50%,-14px);pointer-events:none;overflow:hidden}
  .ptr .logo{width:46px;height:13px;display:block;transform:scale(.7);opacity:.5;transition:transform .2s var(--spring),opacity .2s}
  .ptr.ready .logo{transform:none;opacity:1} .ptr.spin .logo{opacity:1;transform:none}
  /* SWAP 로고: 로딩 때 S·w·a·p 가 한 글자씩 위에서 떨어져 통 튀고, 순서대로 사라지기를 반복 */
  .logo{fill:var(--p);overflow:visible}
  .logo .l{transform-box:fill-box;transform-origin:center bottom}
  @keyframes letterdrop{0%{transform:translateY(-32px);opacity:0}22%{transform:translateY(2px);opacity:1}32%{transform:translateY(-1.5px)}40%{transform:translateY(0)}72%{transform:translateY(0);opacity:1}88%{transform:translateY(12px);opacity:0}100%{transform:translateY(12px);opacity:0}}
  .loadlogo .logo .l,.ptr.spin .logo .l{animation:letterdrop 1.7s cubic-bezier(.3,1.3,.6,1) infinite}
  .loadlogo .logo .l:nth-child(2),.ptr.spin .logo .l:nth-child(2){animation-delay:.11s}
  .loadlogo .logo .l:nth-child(3),.ptr.spin .logo .l:nth-child(3){animation-delay:.22s}
  .loadlogo .logo .l:nth-child(4),.ptr.spin .logo .l:nth-child(4){animation-delay:.33s}
  .loadlogo{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 22px;overflow:hidden}
  .loadlogo .logo{width:104px;height:29px}
  .loadlogo span{margin-top:14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .fback:active{background:#fff;transform:scale(.88)}
  .ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 18px;min-height:42px}
  .ptitle .rt{flex:0 0 auto}
  .hbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:-.2px;
        box-shadow:0 8px 18px rgba(120,32,232,.28);transition:transform .25s var(--spring),box-shadow .2s}
  .hbtn:active{transform:scale(.94);box-shadow:0 3px 8px rgba(120,32,232,.2)}
  .hbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .view.anim .hbtn{animation:pop .5s var(--spring) .1s both}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 8px;scrollbar-width:none} .days::-webkit-scrollbar{display:none}
  .days button{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:#fff;font-weight:600;font-size:14px;color:var(--ink2);box-shadow:0 1px 3px rgba(25,31,40,.04);transition:all .2s var(--spring)}
  .days button b{margin-left:5px;color:var(--muted);font-weight:700} .days button.on{background:var(--ink);color:#fff} .days button.on b{color:rgba(255,255,255,.7)}
  .days button:active{transform:scale(.93)}
  .tl{margin:0;padding:0;list-style:none}
  .tl li{display:flex;gap:12px;padding:13px 4px;border-top:1px solid var(--fill);align-items:flex-start}
  .tl li:first-child{border-top:0}
  .tl .tm{flex:0 0 46px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;color:var(--ink2);padding-top:1px}
  .tl .dt{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted2)}
  .tl .dt.a-등록{background:var(--p)} .tl .dt.a-상태변경{background:#3182f6} .tl .dt.a-수정,.tl .dt.a-출고기기수정{background:#f5a524} .tl .dt.a-태그해제{background:var(--green)}
  .tl .bd{flex:1;min-width:0} .tl .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px} .tl .ds{font-size:13.5px;color:var(--muted);margin-top:1px}
  .tl .sn{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted2);margin-left:6px}
  .brk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .brk span{background:var(--fill);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2)} .brk span b{color:var(--ink);margin-left:3px}
  .view.anim .tl li{animation:rise .42s var(--spring) both}
  .tl li:nth-child(2){animation-delay:.03s}.tl li:nth-child(3){animation-delay:.06s}.tl li:nth-child(4){animation-delay:.09s}.tl li:nth-child(5){animation-delay:.12s}.tl li:nth-child(6){animation-delay:.15s}.tl li:nth-child(7){animation-delay:.18s}.tl li:nth-child(n+8){animation-delay:.21s}
  .ptitle.indent{padding-left:54px}
  .ptitle h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
  .ptitle .sub{font-size:14.5px;color:var(--muted);margin-top:3px;font-weight:500}
  .hello{margin:6px 4px 18px}
  .hello .date{font-size:14px;color:var(--muted);font-weight:600}
  .hello h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .hello .hlogo{display:inline-flex;align-items:center} .hello .hlogo .logo{width:96px;height:27px;display:block}
  .view.anim .hello .logo .l{animation:letterin .6s var(--spring) both}
  .hello .logo .l:nth-child(2){animation-delay:.08s} .hello .logo .l:nth-child(3){animation-delay:.16s} .hello .logo .l:nth-child(4){animation-delay:.24s}
  @keyframes letterin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

  .tabbar{height:var(--tab-h);flex:0 0 auto;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
          border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#b0b8c1;transition:color .15s}
  .tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .tabbar button.on{color:var(--ink)} .tabbar button.on svg{stroke-width:2.3;animation:tabpop .4s var(--spring)}
  .tabbar button:active svg{transform:scale(.85)}
  @keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:none}}

  .card{background:var(--card);border-radius:var(--r);padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(25,31,40,.03)}
  .card h3{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.3px}
  .card .more{font-size:13.5px;font-weight:600;color:var(--muted)}
  .sum{padding:22px 20px 18px}
  .sum .lb{font-size:14px;color:var(--muted);font-weight:600}
  .sum .big{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .sum .big b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15}
  .sum .big span{font-size:18px;font-weight:700;color:var(--ink2)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .stats button{background:var(--fill2);border-radius:14px;padding:12px 6px 10px;text-align:center;color:var(--ink);transition:transform .25s var(--spring),background .15s}
  .stats button:active{transform:scale(.93);background:var(--fill)}
  .stats button span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .stats button b{display:block;font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.6px;line-height:1.2}
  .stats button.hot{background:var(--p);color:#fff} .stats button.hot span{color:rgba(255,255,255,.85)}
  .stats button.wide{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:6px} .stats button.wide b{margin:0}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  .dot.s-입고{background:var(--p)} .dot.s-수리대기{background:#f5a524} .dot.s-수리가능{background:#3182f6} .dot.s-재고{background:var(--green)} .dot.s-출고대기중{background:#14b8a6}
  .dot.s-출고준비완료{background:var(--green)} .hot .dot{background:#fff}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
       background:var(--p);color:#fff;text-decoration:none;letter-spacing:-.2px;
       transition:transform .25s var(--spring),opacity .15s,background .15s}
  .btn:active{transform:scale(.96);opacity:.9}
  .btn.dark{background:var(--ink)}
  .btn.line{background:var(--fill);color:var(--ink2)}
  .btn.ghost{background:var(--p-soft);color:var(--p-ink)}
  .btn.green{background:var(--green)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.sm{padding:13px 14px;font-size:15px;width:auto;flex:1;border-radius:14px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:8px;margin-top:12px}
  .field{margin-bottom:10px} .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .input{width:100%;padding:15px 16px;border-radius:var(--r2);border:0;background:var(--fill);outline:none;transition:box-shadow .15s,background .15s;font-weight:500}
  .input::placeholder{color:var(--muted2)}
  .input:focus{background:#fff;box-shadow:0 0 0 2px var(--p)}
  .input.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;font-weight:700;font-size:20px;text-transform:uppercase;text-align:center}
  .muted{color:var(--muted);font-size:14px}
  .empty{text-align:center;padding:36px 10px;color:var(--muted2);font-size:14.5px;line-height:1.6}
  /* 스켈레톤 로딩 */
  @keyframes rot{to{transform:rotate(360deg)}}
  .sk{background:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:14px;animation:rise .4s var(--spring) both}
  .sk:nth-child(2){animation-delay:.06s} .sk:nth-child(3){animation-delay:.12s} .sk:nth-child(4){animation-delay:.18s}
  .sk i,.sk s{display:block;border-radius:8px;background:linear-gradient(90deg,#f2f4f6 25%,#e8ebef 37%,#f2f4f6 63%);background-size:400% 100%;animation:shim 1.4s ease infinite}
  .sk i{height:14px;margin-top:10px} .sk i.t{height:20px;width:45%;margin-top:0} .sk i.w6{width:60%} .sk i.w8{width:85%}
  .sk .r{display:flex;gap:12px;align-items:center;margin-top:14px} .sk .r s{flex:0 0 48px;height:48px;border-radius:16px} .sk .r div{flex:1} .sk .r div i:first-child{margin-top:0}
  @keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

  .code-badge{display:inline-flex;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:3px;
              background:var(--p-soft);color:var(--p-ink);padding:7px 12px 7px 14px;border-radius:12px}
  .pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:-.1px;white-space:nowrap}
  .s-입고{background:var(--p-soft);color:var(--p-ink)}
  .s-수리대기{background:var(--amber);color:var(--amber-ink)}
  .s-수리가능{background:var(--blue-soft);color:var(--blue-ink)}
  .s-재고{background:var(--lime);color:var(--lime-ink)}
  .s-출고대기중{background:#dcf7f2;color:#0b6e63}
  .flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--muted2)}
  .flow span{padding:4px 9px;border-radius:999px;background:var(--fill)} .flow span.on{background:var(--ink);color:#fff} .flow span.done{color:var(--ink2)} .flow i{font-style:normal;color:var(--line2)}
  .btn.lock{pointer-events:none}
  /* 재고/출고대기중 버튼: 자물쇠 잠금·해제 모션 */
  .btn.fin{position:relative;overflow:hidden}
  .btn.fin .lk{position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;display:none;opacity:.75}
  .btn.fin .lk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible;display:block}
  .btn.fin .lk .sh{transform-origin:16px 11px}
  .btn.fin.lock{background:var(--fill);color:var(--muted2);padding-left:34px} .btn.fin.lock .lk{display:block} .btn.fin.lock .lb{opacity:.75}
  .btn.fin.unlocking,.btn.fin.locking{pointer-events:none}
  .btn.fin.unlocking{animation:btnun 1.6s ease both} .btn.fin.unlocking .lk{display:block;animation:lkun 1.6s cubic-bezier(.3,1.2,.5,1) both}
  .btn.fin.unlocking .lk .sh{animation:shopen 1.6s ease both} .btn.fin.unlocking .lb{animation:lbun 1.6s ease both}
  @keyframes btnun{0%,78%{background:var(--fill);color:var(--muted2)}100%{background:var(--fin);color:#fff}}
  @keyframes lkun{0%{left:14px;transform:scale(1);opacity:.75}22%{left:50%;transform:translateX(-50%) scale(1.9);opacity:1}72%{left:50%;transform:translateX(-50%) scale(1.9);opacity:1}100%{left:50%;transform:translateX(-50%) scale(0);opacity:0}}
  @keyframes shopen{0%,38%{transform:none}52%{transform:rotate(38deg) translateY(-1px)}60%{transform:rotate(30deg) translateY(-1px)}100%{transform:rotate(32deg) translateY(-1px)}}
  @keyframes lbun{0%{opacity:.75}18%,72%{opacity:0}100%{opacity:1}}
  .btn.fin.locking{animation:btnlk 1.6s ease both} .btn.fin.locking .lk{display:block;animation:lklk 1.6s cubic-bezier(.3,1.2,.5,1) both}
  .btn.fin.locking .lk .sh{animation:shclose 1.6s ease both} .btn.fin.locking .lb{animation:lblk 1.6s ease both}
  @keyframes btnlk{0%{background:var(--fin);color:#fff}22%,100%{background:var(--fill);color:var(--muted2)}}
  @keyframes lklk{0%{left:50%;transform:translateX(-50%) scale(0);opacity:0}22%{left:50%;transform:translateX(-50%) scale(1.9);opacity:1}72%{left:50%;transform:translateX(-50%) scale(1.9);opacity:1}100%{left:14px;transform:scale(1);opacity:.75}}
  @keyframes shclose{0%,38%{transform:rotate(32deg) translateY(-1px)}50%{transform:rotate(-4deg)}58%,100%{transform:none}}
  @keyframes lblk{0%{opacity:1}18%,72%{opacity:0}100%{opacity:.75}}
  .pill.sys{background:var(--danger-soft);color:var(--danger)} .pill.sys.sm{font-size:10.5px;padding:3px 7px}
  .s-출고준비완료{background:var(--lime);color:var(--lime-ink)}
  .kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;letter-spacing:-.2px}
  .kind.in{background:var(--p);color:#fff} .kind.out{background:var(--green);color:#fff} .kind.stock{background:var(--ink2);color:#fff}
  .kindpick.three{grid-template-columns:1fr 1fr 1fr} .kindpick.three button{padding:16px 10px} .kindpick.three b{font-size:15px} .kindpick.three span{font-size:12px}

    70%{transform:translate(8px,-4px)} 88%{transform:translate(-8px,6px);clip-path:inset(65% 0 0 0)} 89.5%{transform:translate(6px,-3px);clip-path:inset(0)}}

  .lcard{position:relative;flex:0 0 auto;width:100%;max-width:340px;padding:26px 22px 22px;border-radius:28px;background:rgba(22,17,34,.62);border:1px solid rgba(255,255,255,.13);

    '<button class="btn" onclick="buildLabels()">새 코드로 만들기</button><div class="row"><button class="btn line sm" onclick="window.print()">인쇄</button><button class="btn line sm" onclick="downloadLabels()">HTML 저장</button></div>'+
    '<p class="muted" style="margin:12px 0 0">코드는 매번 무작위로 새로 만들어집니다. 인쇄물에 브라우저 머리글이 끼면 <b>HTML 저장</b> 후 그 파일을 열어 인쇄하세요.</p></div>'+
    '<div class="card"><h3 id="lcount">미리보기</h3><div class="lab-preview" id="lprev"></div></div>';
  buildLabels(); }};
var labelCodes=[];
function drawQR(el,text,size){ if(typeof QRCode==='undefined'){ el.innerHTML='<div style="width:'+size+'px;height:'+size+'px;border:1.5px dashed #c9ced5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9295a0;text-align:center">QR 로드 실패<br>새로고침</div>'; return; } new QRCode(el,{text:text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M}); }
function qrUrl(c){ return WEBAPP+(WEBAPP.indexOf('?')>=0?'&':'?')+'q='+c; }
function buildLabels(){ var pages=Math.max(1,Math.min(20,parseInt($('lpages').value,10)||1)); var per=parseInt($('lper').value,10);
  labelCodes=[]; for(var i=0;i<pages*per;i++) labelCodes.push(genCode());
  var pv=$('lprev'); pv.innerHTML=''; labelCodes.slice(0,8).forEach(function(c){ var el=document.createElement('div'); el.className='lb'; el.innerHTML='<div class="qr"></div><div><div class="c">'+c+'</div><div class="t">경기남부점 입출고</div></div>'; pv.appendChild(el); drawQR(el.querySelector('.qr'),qrUrl(c),64); });
  $('lcount').innerHTML='미리보기 · 총 '+num(labelCodes.length,'lc')+'개 (A4 '+pages+'장)'; countUp($('lcount'));
  var pa=$('printarea'); pa.innerHTML=''; var cols=per===12?3:2; var px=per===4?420:(per===8?300:220);
  for(var p=0;p<pages;p++){ var sh=document.createElement('div'); sh.className='psheet c'+cols+' sz'+per;
    for(var k=0;k<per;k++){ var c=labelCodes[p*per+k]; var lb=document.createElement('div'); lb.className='plabel';
      lb.innerHTML='<div class="left"><div class="qr"></div></div>'+
        '<div class="right"><div class="code">'+c+'</div><div class="box"><b>고객 성함</b></div><div class="brand">SWAP 경기남부점</div></div>';
      sh.appendChild(lb); drawQR(lb.querySelector('.qr'),qrUrl(c),px); } pa.appendChild(sh); } }
function downloadLabels(){ var css=document.querySelector('style').textContent.split('@media print{')[1]||''; css=css.slice(0,css.lastIndexOf('}'));
  var html='<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>SWAP QR 라벨</title><style>body{margin:0;font-family:Pretendard,-apple-system,sans-serif}#printarea{display:block}'+css+'</style></head><body><div id="printarea">'+$('printarea').innerHTML+'</div></body></html>';
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='SWAP_QR라벨.html'; a.click(); }

/* ================= 환경설정 ================= */
VIEWS.me={ render:function(v){ v.refresh=function(){ VIEWS.me.render(v); return AUTH&&AUTH.admin ? loadCodes(v,true) : Promise.resolve(); };
  var fixedName=!!(AUTH&&!AUTH.admin&&AUTH.name);
  v.el.innerHTML=title('환경설정','')+
    '<div class="card"><div style="display:flex;align-items:center;gap:14px"><div style="flex:0 0 56px;height:56px;border-radius:18px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px">'+esc(initials(worker))+'</div>'+
    '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:21px;letter-spacing:-.5px">'+esc(worker||'이름 없음')+(AUTH&&AUTH.admin?' <span class="pill sys sm" style="background:var(--p-soft);color:var(--p-ink);vertical-align:middle">관리자</span>':'')+'</div>'+
    '<div class="muted">접속 코드 <b style="font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--ink2)">'+esc(AUTH&&AUTH.code||'-')+'</b>'+(fixedName?' · 이름은 관리자가 설정':'')+'</div></div></div>'+
    '<div class="row" style="margin-top:16px;gap:8px">'+(fixedName?'':'<button class="btn line sm" onclick="openNameSheet()">'+(worker?'이름 변경':'이름 입력')+'</button>')+
    '<button class="btn line sm" style="color:#d6336c" onclick="logoutAsk()">로그아웃</button></div></div>'+
    (AUTH&&AUTH.admin?'<div class="card" id="codecard"><h3 style="display:flex;justify-content:space-between;align-items:center">접속 코드 관리<button class="more" onclick="addCodeAsk()">+ 코드 추가</button></h3>'+
      '<p class="muted" style="margin:0 0 6px;font-size:13px">이름을 넣으면 그 코드로 접속한 사람의 작업자 이름이 자동으로 정해져요. 스위치를 끄면 그 코드로는 접속할 수 없어요.</p><div id="codes">'+spin()+'</div></div>':'')+
    '<div class="card"><h3>쓰는 법</h3><ul class="hist">'+
    '<li><span><b>등록</b> → 기기에 QR 붙이고 찍기 → 작업 선택 → 출고/수거 → 일련번호 → 액세서리 → 특이사항</span></li>'+
    '<li><span><b>검색</b> → 고객명·일련번호로 등록 QR/작업리스트/어드민 찾기 → 항목 선택 → QR 찍어 매칭. 작업이 없는 기기는 <b>재고 기기</b>로 등록</span></li>'+
    '<li><span><b>현황</b> → 홈의 상태 칸이나 전체 보기. 오른쪽 위 <b>내 작업 현황</b>에서 슬랙 보고</span></li>'+
    '<li><span><b>자전거 주문</b> → 출고 QR 1장 · <b>교체수리</b> → 출고 1장 + 수거 1장</span></li>'+
    '<li><span><b>수거 기기</b> → 입고 → 수리대기 → <b>수리가능</b> → 재고 또는 출고 대기중 (수리가능을 지나야 넘어감)</span></li>'+
    '<li><span><b>출고 기기</b> → 등록하면 바로 출고 준비완료</span></li>'+
    '<li><span><b>⚠️전산미완료</b> → 재고·출고준비완료 기기인데 어드민 고객요청이 완료가 아닐 때 표시. 어드민에서 완료 처리하면 사라짐(15분마다 자동 확인, 상세 화면 열면 즉시 확인)</span></li>'+
    '<li><span><b>용지 재사용</b> → 기기가 나간 뒤 태그 비우기</span></li>'+
    '<li><span><b>뒤로가기</b> → 폰 뒤로가기 버튼, 왼쪽 위 ‹, 또는 화면 왼쪽 끝에서 오른쪽으로 밀기</span></li>'+
    '<li><span><b>새로고침</b> → 화면 맨 위에서 아래로 당기기</span></li>'+
    '<li><span><b>작업 보고</b> → 현황 화면 오른쪽 위 <b>내 작업 현황</b> → 날짜 선택 → 슬랙으로 보내기</span></li></ul></div>'+
    '<div class="card"><h3>앱으로 쓰기</h3><p class="muted" style="margin:0 0 10px">홈 화면에 아이콘으로 두면 앱처럼 바로 열립니다.</p>'+
    '<button class="btn" id="installbtn" onclick="installApp()">홈 화면에 설치</button></div>'+
    '<div class="card"><h3>기록</h3><p class="muted" style="margin:0">등록·이력은 "SWAP 입출고 QR" 구글시트의 태그·이력 탭에 쌓입니다. 접속 코드는 접속코드 탭.</p></div>'+
    '<p class="muted" style="text-align:center;font-size:12px">SWAP 입출고 v'+APP_VER+' · '+(('BarcodeDetector' in window)?'내장 스캐너':'jsQR')+' · '+(window.isSecureContext?'https':'http')+'</p>';
  if(AUTH&&AUTH.admin) loadCodes(v); }};
function loadCodes(v){ return run('listCodes').then(function(list){ if(stack.indexOf(v)<0) return; v.state.codes=list; drawCodes(v); }).catch(function(e){ var el=$('codes'); if(el) el.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }); }
function drawCodes(v){ var el=$('codes'); if(!el) return; var list=v.state.codes||[];
  if(!list.length){ el.innerHTML='<div class="empty">코드가 없어요. 오른쪽 위 + 코드 추가</div>'; return; }
  el.innerHTML=list.map(function(c){ return '<div class="crow'+(c.active?'':' off')+'"><div class="cc">'+esc(c.code)+'</div>'+
    '<div class="cn"><input class="input" value="'+esc(c.name)+'" placeholder="이름 (예: 홍길동)" data-code="'+esc(c.code)+'" onchange="saveCodeName(this)" onkeydown="if(event.key===\'Enter\') this.blur()">'+
    '<div class="cm">'+(c.last?'최근 접속 '+esc(String(c.last).slice(5,16))+' · '+(c.count||0)+'회':'아직 접속 안 함')+'</div></div>'+
    '<button class="sw'+(c.active?' on':'')+'" aria-label="사용" onclick="toggleCode(\''+esc(c.code)+'\','+(c.active?'false':'true')+',this)"></button></div>'; }).join(''); }
function codeView(){ var v=stack[stack.length-1]; return (v&&v.name==='me')?v:null; }
function saveCodeName(inp){ var v=codeView(); var code=inp.getAttribute('data-code'); var name=inp.value.trim();
  run('setCodeName',code,name).then(function(list){ if(v){ v.state.codes=list; } toast(code+' 이름 저장'); if(v) drawCodes(v); }).catch(function(e){ toast('저장 실패: '+e.message); }); }
function toggleCode(code,active,btn){ var v=codeView(); btn.classList.toggle('on',active); if(navigator.vibrate) navigator.vibrate(8);
  run('setCodeActive',code,active).then(function(list){ if(v){ v.state.codes=list; drawCodes(v); } toast(code+(active?' 사용':' 사용 중지')); }).catch(function(e){ btn.classList.toggle('on',!active); toast('변경 실패: '+e.message); }); }
function addCodeAsk(){ openSheet('<h3>새 접속 코드</h3><p>코드는 자동으로 만들어져요. 이름은 나중에 바꿀 수 있어요.</p>'+
  '<input class="input" id="ncn" placeholder="이름 (선택)" style="margin-bottom:12px"><button class="btn" onclick="addCodeGo()">코드 만들기</button>'); setTimeout(function(){ $('ncn').focus(); },380); }
function addCodeGo(){ var name=($('ncn').value||'').trim(); var v=codeView(); closeSheet(function(){ toast('코드 만드는 중…');
  run('addCode',name).then(function(list){ if(v){ v.state.codes=list; drawCodes(v); } var nw=list[list.length-1]; toast('새 코드: '+(nw?nw.code:'')); }).catch(function(e){ toast('추가 실패: '+e.message); }); }); }

/* ================= 로그인 ================= */
function setLoginErr(m){ var e=$('lerr'); if(e) e.textContent=m||''; }
function showLogin(msg){ var l=$('login'); if(!$('glitch').innerHTML) $('glitch').innerHTML='<span class="g g1">'+LOGO+'</span><span class="g g2">'+LOGO+'</span><span class="g g3">'+LOGO+'</span>';
  $('lver').textContent='SWAP 입출고 v'+APP_VER; l.style.display=''; l.classList.remove('out'); setLoginErr(msg||''); $('lcode').value=''; $('lbtn').disabled=false;
  setTimeout(function(){ try{ $('lcode').focus(); }catch(e){} },500); }
function hideLogin(){ var l=$('login'); l.classList.add('out'); setTimeout(function(){ l.style.display='none'; },480); }
function doLogin(){ var code=($('lcode').value||'').trim().toUpperCase(); var card=$('lcard');
  if(code.length<5){ setLoginErr('코드는 5자리예요'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); return; }
  $('lbtn').disabled=true; $('lbtn').textContent='확인 중…'; setLoginErr(''); $('glitch').classList.add('wild');
  run('login',code).then(function(a){ applyAuth(a); $('glitch').classList.remove('wild'); if(navigator.vibrate) navigator.vibrate([10,30,10]); hideLogin(); startApp(); })
    .catch(function(e){ $('glitch').classList.remove('wild'); $('lbtn').disabled=false; $('lbtn').textContent='접속'; setLoginErr(e.message||'접속 실패'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }); }
function applyAuth(a){ AUTH={code:a.code,name:a.name||'',admin:!!a.admin}; try{ localStorage.setItem('swapAuth',JSON.stringify(AUTH)); }catch(e){}
  if(a.name&&!a.admin&&worker!==a.name){ worker=a.name; localStorage.setItem('swapWorker',a.name); } }
var loggingOut=false;
function logout(msg){ if(loggingOut) return; loggingOut=true; AUTH=null; try{ localStorage.removeItem('swapAuth'); }catch(e){}
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('swapc:')===0) localStorage.removeItem(k); }); }catch(e){}
  var u=location.pathname+(msg?'?bye='+encodeURIComponent(msg):''); location.replace(u); }
function logoutAsk(){ openSheet('<h3>로그아웃</h3><p>다시 들어오려면 접속 코드를 입력해야 해요.</p><div class="row"><button class="btn line sm" onclick="closeSheet()">취소</button><button class="btn sm" style="background:#d6336c" onclick="logout()">로그아웃</button></div>'); }
var appStarted=false;
function startApp(){ if(appStarted) return; appStarted=true;
  tabTo('home');
  if(CODE) push('tag',{code:CODE});
  setTimeout(prefetch, 800); }
function boot(){ try{ history.replaceState({d:0},''); }catch(e){}
  var bye=new URLSearchParams(location.search).get('bye');
  if(bye){ try{ history.replaceState({d:0},'',location.pathname); }catch(e){} }
  if(AUTH&&AUTH.code&&!bye){ startApp();   // 저장된 코드로 바로 시작하고, 뒤에서 아직 쓸 수 있는 코드인지 확인
    run('login',AUTH.code).then(applyAuth).catch(function(e){ if(e.auth===false) logout(e.message); }); }
  else showLogin(bye||''); }

/* ================= 시작 ================= */
/* PWA: 설치 프롬프트 잡아두기 + 서비스워커 등록 */
var installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; var b=$('installbtn'); if(b) b.style.display=''; });
window.addEventListener('appinstalled',function(){ installEvt=null; toast('홈 화면에 설치됐어요'); var b=$('installbtn'); if(b) b.style.display='none'; });
function installApp(){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; }); return; }
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  openSheet('<h3>홈 화면에 추가</h3><p>'+(ios?'사파리 아래 <b>공유</b> 버튼(네모에 화살표) → <b>홈 화면에 추가</b>를 누르세요.':'크롬 오른쪽 위 <b>⋮ 메뉴</b> → <b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.')+'</p><button class="btn" onclick="closeSheet()">확인</button>'); }
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

boot();
</script>

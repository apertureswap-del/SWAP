<style>
  :root{
    --bg:#f2f4f6; --card:#ffffff; --fill:#f2f4f6; --fill2:#f9fafb; --line:#e5e8eb; --line2:#d1d6db;
    --ink:#191f28; --ink2:#333d4b; --muted:#6b7684; --muted2:#8b95a1;
    --p:#7820e8; --p-dark:#5b12b8; --p-soft:#f1e9ff; --p-soft2:#e4d4ff; --p-ink:#4a0fa3;
    --green:#0fa958; --green-soft:#e6f8ee; --green-ink:#0b7a40;
    --lime:#e6f8ee; --lime-ink:#0b7a40; --amber:#fff4d6; --amber-ink:#8a5a00; --blue-soft:#e8f3ff; --blue-ink:#1b64da;
    --danger:#f04452; --danger-soft:#fdecec;
    --r:20px; --r2:14px; --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.2,.36,1); --dur:.42s; --tab-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;
       font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
  input,select,textarea{font:inherit;color:var(--ink)} a{color:inherit}
  b,strong{font-weight:700}

  .app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg)}
  .stage{position:relative;flex:1;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);overscroll-behavior-y:contain;
        padding:calc(16px + env(safe-area-inset-top)) 20px calc(var(--tab-h) + 28px);will-change:transform,opacity;
        transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
        box-shadow:-12px 0 32px rgba(25,31,40,.16)}
  .view.enter{transform:translateX(100%) scale(.98);opacity:.85}
  .view.under{transform:translateX(-30%) scale(.96);opacity:.55}
  .view.under::after{content:'';position:absolute;inset:0;background:rgba(25,31,40,.18);pointer-events:none}
  .view.fade-in{animation:tabin .34s var(--spring) both}
  .view.fade-out{animation:tabout .18s ease both}
  @keyframes tabin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes tabout{to{opacity:0;transform:scale(.985)}}
  .view.anim .card,.view.anim .item,.view.anim .hello,.view.anim .list{animation:rise .42s var(--spring) both}
  .item:nth-child(2){animation-delay:.03s}.item:nth-child(3){animation-delay:.06s}.item:nth-child(4){animation-delay:.09s}.item:nth-child(5){animation-delay:.12s}
  .item:nth-child(6){animation-delay:.15s}.item:nth-child(7){animation-delay:.18s}.item:nth-child(8){animation-delay:.21s}
  .card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .view.anim .stats button{animation:pop .5s var(--spring) both}
  .stats button:nth-child(2){animation-delay:.04s}.stats button:nth-child(3){animation-delay:.08s}.stats button:nth-child(4){animation-delay:.12s}
  .stats button:nth-child(5){animation-delay:.16s}.stats button:nth-child(6){animation-delay:.2s}.stats button:nth-child(7){animation-delay:.24s}.stats button:nth-child(8){animation-delay:.28s}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .view.anim .pill{animation:pillin .4s var(--spring) both}
  @keyframes pillin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .view.anim .code-badge{animation:pop .5s var(--spring) both}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  .view.has-back{padding-top:calc(16px + env(safe-area-inset-top))}
  .fback{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;
         background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(25,31,40,.10);display:flex;align-items:center;justify-content:center;
         z-index:6;opacity:0;pointer-events:none;transform:scale(.8);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s,transform .35s var(--spring)}
  .fback.on{opacity:1;pointer-events:auto;transform:none}
  .ptr{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));width:78px;height:40px;background:transparent;
       display:flex;align-items:center;justify-content:center;z-index:7;opacity:0;transform:translate(-50%,-14px);pointer-events:none;overflow:hidden}
  .ptr .logo,.ptr .slogo{width:46px;height:13px;display:block;transform:scale(.7);opacity:.5;transition:transform .2s var(--spring),opacity .2s}
  .ptr .slogo{width:auto;height:16px}
  .ptr.ready .logo,.ptr.ready .slogo{transform:none;opacity:1} .ptr.spin .logo,.ptr.spin .slogo{opacity:1;transform:none}
  /* SWAP 로고: 로딩 때 S·w·a·p 가 한 글자씩 위에서 떨어져 통 튀고, 순서대로 사라지기를 반복 */
  .logo{fill:var(--p);overflow:visible}
  .logo .l{transform-box:fill-box;transform-origin:center bottom}
  @keyframes letterdrop{0%{transform:translateY(-32px);opacity:0}22%{transform:translateY(2px);opacity:1}32%{transform:translateY(-1.5px)}40%{transform:translateY(0)}72%{transform:translateY(0);opacity:1}88%{transform:translateY(12px);opacity:0}100%{transform:translateY(12px);opacity:0}}
  .loadlogo .logo .l,.ptr.spin .logo .l,.loadlogo .slogo .l,.ptr.spin .slogo .l{animation:letterdrop 1.7s cubic-bezier(.3,1.3,.6,1) infinite}
  .loadlogo .l:nth-child(2),.ptr.spin .l:nth-child(2){animation-delay:.11s}
  .loadlogo .l:nth-child(3),.ptr.spin .l:nth-child(3){animation-delay:.22s}
  .loadlogo .l:nth-child(4),.ptr.spin .l:nth-child(4){animation-delay:.33s}
  .loadlogo .l:nth-child(5),.ptr.spin .l:nth-child(5){animation-delay:.44s}
  /* SWING 로고: 글자별 PNG(검정)를 원래 위치에 배치 */
  .slogo{position:relative;display:inline-block;height:29px;vertical-align:middle} .slogo .l{position:absolute;height:auto;display:block;transform-origin:center bottom}
  .loadlogo .slogo{height:36px} .hello .slogo{height:30px;margin-right:2px}
  .loadlogo{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 22px;overflow:hidden}
  .loadlogo .logo{width:104px;height:29px}
  .loadlogo span{margin-top:14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .fback:active{background:#fff;transform:scale(.88)}
  .ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 18px;min-height:42px}
  .ptitle .rt{flex:0 0 auto}
  .hbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:-.2px;
        box-shadow:0 8px 18px rgba(120,32,232,.28);transition:transform .25s var(--spring),box-shadow .2s}
  .hbtn:active{transform:scale(.94);box-shadow:0 3px 8px rgba(120,32,232,.2)}
  .hbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .view.anim .hbtn{animation:pop .5s var(--spring) .1s both}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 8px;scrollbar-width:none} .days::-webkit-scrollbar{display:none}
  .days button{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:#fff;font-weight:600;font-size:14px;color:var(--ink2);box-shadow:0 1px 3px rgba(25,31,40,.04);transition:all .2s var(--spring)}
  .days button b{margin-left:5px;color:var(--muted);font-weight:700} .days button.on{background:var(--ink);color:#fff} .days button.on b{color:rgba(255,255,255,.7)}
  .days button:active{transform:scale(.93)}
  .tl{margin:0;padding:0;list-style:none}
  .tl li{display:flex;gap:12px;padding:13px 4px;border-top:1px solid var(--fill);align-items:flex-start}
  .tl li:first-child{border-top:0}
  .tl .tm{flex:0 0 46px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;color:var(--ink2);padding-top:1px}
  .tl .dt{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted2)}
  .tl .dt.a-등록{background:var(--p)} .tl .dt.a-상태변경{background:#3182f6} .tl .dt.a-수정,.tl .dt.a-출고기기수정{background:#f5a524} .tl .dt.a-태그해제{background:var(--green)}
  .tl .bd{flex:1;min-width:0} .tl .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px} .tl .ds{font-size:13.5px;color:var(--muted);margin-top:1px}
  .tl .sn{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted2);margin-left:6px}
  .brk{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .brk span{background:var(--fill);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2)} .brk span b{color:var(--ink);margin-left:3px}
  .view.anim .tl li{animation:rise .42s var(--spring) both}
  .tl li:nth-child(2){animation-delay:.03s}.tl li:nth-child(3){animation-delay:.06s}.tl li:nth-child(4){animation-delay:.09s}.tl li:nth-child(5){animation-delay:.12s}.tl li:nth-child(6){animation-delay:.15s}.tl li:nth-child(7){animation-delay:.18s}.tl li:nth-child(n+8){animation-delay:.21s}
  .ptitle.indent{padding-left:54px}
  .ptitle h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
  .ptitle .sub{font-size:14.5px;color:var(--muted);margin-top:3px;font-weight:500}
  .hello{margin:6px 4px 18px}
  .hello .date{font-size:14px;color:var(--muted);font-weight:600}
  .hello h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .hello .hlogo{display:inline-flex;align-items:center} .hello .hlogo .logo{width:96px;height:27px;display:block}
  .view.anim .hello .logo .l{animation:letterin .6s var(--spring) both}
  .hello .logo .l:nth-child(2){animation-delay:.08s} .hello .logo .l:nth-child(3){animation-delay:.16s} .hello .logo .l:nth-child(4){animation-delay:.24s}
  @keyframes letterin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

  .tabbar{height:var(--tab-h);flex:0 0 auto;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
          border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#b0b8c1;transition:color .15s}
  .tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .tabbar button.on{color:var(--ink)} .tabbar button.on svg{stroke-width:2.3;animation:tabpop .4s var(--spring)}
  .tabbar button:active svg{transform:scale(.85)}
  @keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:none}}

  .card{background:var(--card);border-radius:var(--r);padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(25,31,40,.03)}
  .card h3{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.3px}
  .card .more{font-size:13.5px;font-weight:600;color:var(--muted)}
  .sum{padding:22px 20px 18px}
  .sum .lb{font-size:14px;color:var(--muted);font-weight:600}
  .sum .big{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .sum .big b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15}
  .sum .big span{font-size:18px;font-weight:700;color:var(--ink2)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .stats button{background:var(--fill2);border-radius:14px;padding:12px 6px 10px;text-align:center;color:var(--ink);transition:transform .25s var(--spring),background .15s}
  .stats button:active{transform:scale(.93);background:var(--fill)}
  .stats button span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .stats button b{display:block;font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.6px;line-height:1.2}
  .stats button.hot{background:var(--p);color:#fff} .stats button.hot span{color:rgba(255,255,255,.85)}
  .stats button.wide{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:6px} .stats button.wide b{margin:0}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  .dot.s-입고{background:var(--p)} .dot.s-수리대기{background:#f5a524} .dot.s-수리가능{background:#3182f6} .dot.s-재고{background:var(--green)} .dot.s-출고대기중{background:#14b8a6}
  .dot.s-출고준비완료{background:var(--green)} .dot.s-출고완료{background:var(--muted2)} .hot .dot{background:#fff}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
       background:var(--p);color:#fff;text-decoration:none;letter-spacing:-.2px;
       transition:transform .25s var(--spring),opacity .15s,background .15s}
  .btn:active{transform:scale(.96);opacity:.9}
  .btn.dark{background:var(--ink)}
  .btn.line{background:var(--fill);color:var(--ink2)}
  /* SWING 서버 테마: 보라 대신 검정 */
  body.swing{--p:#111318;--p-dark:#000;--p-soft:#e9eaef;--p-soft2:#d9dbe3;--p-ink:#111318}
  body.swing .hbtn{box-shadow:0 8px 18px rgba(0,0,0,.22)} body.swing .hbtn:active{box-shadow:0 3px 8px rgba(0,0,0,.18)}
  body.swing .hr.on{box-shadow:0 8px 18px rgba(0,0,0,.22)} body.swing .rcard:not(.lock){box-shadow:0 0 0 2px var(--p),0 10px 26px rgba(0,0,0,.14)}
  body.swing .swgrid .ph .ov{background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 3px #111318} body.swing .swgrid .ph.on .ov::after{background:#111318}
  body.swing .selbar .ok,body.swing .hbtn[style*="4a154b"]{background:#111318 !important}
  .btn.ghost{background:var(--p-soft);color:var(--p-ink)}
  .btn.green{background:var(--green)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.sm{padding:13px 14px;font-size:15px;width:auto;flex:1;border-radius:14px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:8px;margin-top:12px}
  .field{margin-bottom:10px} .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .input{width:100%;padding:15px 16px;border-radius:var(--r2);border:0;background:var(--fill);outline:none;transition:box-shadow .15s,background .15s;font-weight:500}
  .input::placeholder{color:var(--muted2)}
  .input:focus{background:#fff;box-shadow:0 0 0 2px var(--p)}
  .input.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;font-weight:700;font-size:20px;text-transform:uppercase;text-align:center}
  .muted{color:var(--muted);font-size:14px}
  .empty{text-align:center;padding:36px 10px;color:var(--muted2);font-size:14.5px;line-height:1.6}
  /* 스켈레톤 로딩 */
  @keyframes rot{to{transform:rotate(360deg)}}
  .sk{background:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:14px;animation:rise .4s var(--spring) both}
  .sk:nth-child(2){animation-delay:.06s} .sk:nth-child(3){animation-delay:.12s} .sk:nth-child(4){animation-delay:.18s}
  .sk i,.sk s{display:block;border-radius:8px;background:linear-gradient(90deg,#f2f4f6 25%,#e8ebef 37%,#f2f4f6 63%);background-size:400% 100%;animation:shim 1.4s ease infinite}
  .sk i{height:14px;margin-top:10px} .sk i.t{height:20px;width:45%;margin-top:0} .sk i.w6{width:60%} .sk i.w8{width:85%}
  .sk .r{display:flex;gap:12px;align-items:center;margin-top:14px} .sk .r s{flex:0 0 48px;height:48px;border-radius:16px} .sk .r div{flex:1} .sk .r div i:first-child{margin-top:0}
  @keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

  .code-badge{display:inline-flex;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:3px;
              background:var(--p-soft);color:var(--p-ink);padding:7px 12px 7px 14px;border-radius:12px}
  .pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:-.1px;white-space:nowrap}
  .s-입고{background:var(--p-soft);color:var(--p-ink)}
  .s-수리대기{background:var(--amber);color:var(--amber-ink)}
  .s-수리가능{background:var(--blue-soft);color:var(--blue-ink)}
  .s-재고{background:var(--lime);color:var(--lime-ink)}
  .s-출고대기중{background:#dcf7f2;color:#0b6e63}


  /* ---- SWING (S&P 워크) ---- */
  .swbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swbtns button{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;min-height:104px;padding:14px;border-radius:20px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.3px;text-align:left;box-shadow:0 8px 22px rgba(25,31,40,.12);transition:transform .25s var(--spring)}
  .swbtns button:active{transform:scale(.96)} .swbtns button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .swbtns button small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:-4px}
  .view.anim .swbtns button{animation:pop .5s var(--spring) both}
  .lb{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px}
  .swsrch .input{padding-right:54px} .swsrch .qrbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;border-radius:12px} .swsrch .qrbtn svg{position:static;left:auto;top:auto;transform:none;width:26px;height:26px;stroke:none;fill:none} .swsrch .qrbtn:active{transform:translateY(-50%) scale(.9)}
  /* 기기 카드: 누르면 오른쪽에서 어드민 접속 버튼이 나옴 */
  .devcard{display:flex;align-items:stretch;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(25,31,40,.04),0 6px 20px rgba(25,31,40,.05)}
  .devcard .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:14px;text-align:left;transition:transform .35s var(--spring)}
  .devcard .main .bd{flex:1;min-width:0} .devcard .nm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.3px} .devcard .chev{color:var(--muted2);transition:transform .3s var(--spring)}

  .mitem .mi.em{background:transparent} .mitem .mi.em svg{width:34px;height:34px;stroke:none;fill:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
  .mitem .mt{flex:1;min-width:0} .mitem .mt b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.3px} .mitem .mt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .mitem .ar{color:var(--muted2);font-size:20px}
  /* 신품 체크 */
  .chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;padding:8px 12px;border-radius:12px;background:var(--fill)}

  .chk i::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
  .chk input:checked+i{background:var(--p);border-color:var(--p)} .chk input:checked+i::after{opacity:1}
  .chk.on{background:var(--p-soft);color:var(--p-ink)}

  .srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)} .srow:last-child{border-bottom:0}
  .srow .sn{flex:1;min-width:0} .srow .sn b{font-weight:800;font-size:15px} .srow .sn span{display:block;font-size:12.5px;color:var(--muted)}

  .srow .sv em.ch{background:var(--p-soft);color:var(--p-ink)} .srow .sv em s{text-decoration:line-through;opacity:.55;margin-right:4px}
  .srow.dim .sn b{color:var(--muted)}
  /* ===== 로그인 (접속 코드) ===== */
  .login{position:fixed;inset:0;z-index:60;background:#08070c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,44px);overflow:hidden;
         padding:24px calc(20px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));transition:opacity .45s,transform .45s var(--spring)}
  .login.out{opacity:0;transform:scale(1.04);pointer-events:none}
  .login::before{content:"";position:absolute;inset:-20%;background:radial-gradient(55% 40% at 50% 30%,rgba(120,32,232,.32),transparent 70%);pointer-events:none}
  .glitch{position:relative;flex:0 0 auto;width:92vw;max-width:640px;aspect-ratio:56.3/15.5;pointer-events:none;filter:drop-shadow(0 0 22px rgba(120,32,232,.35))}
  .glitch .g{position:absolute;left:0;top:0;width:100%;display:block;color:#fff}
  .glitch .g .logo{width:100%;height:auto;display:block;fill:currentColor;overflow:visible}
  .glitch .g .logo .l{animation:none}
  .glitch .g2{color:#8a3dff;opacity:.9;mix-blend-mode:screen;animation:glz 2.7s steps(1,end) infinite}
  .glitch .g3{color:#9a9aaa;opacity:.7;animation:glz2 3.4s steps(1,end) infinite}

    41%{clip-path:inset(30% 0 40% 0);transform:translateX(6px)} 42%{clip-path:inset(0);transform:none}}
  @keyframes glz{0%,100%{transform:translate(-7px,4px)} 20%{transform:translate(-4px,3px)} 35%{transform:translate(-12px,6px)}
    36.5%{transform:translate(9px,-5px);clip-path:inset(20% 0 30% 0)} 38%{transform:translate(-7px,4px);clip-path:inset(0)}
    62%{transform:translate(-3px,2px)} 78%{transform:translate(-9px,5px)} 79.5%{transform:translate(14px,1px);clip-path:inset(50% 0 5% 0)} 81%{clip-path:inset(0);transform:translate(-7px,4px)}}
  @keyframes glz2{0%,100%{transform:translate(6px,-3px)} 15%{transform:translate(3px,-2px)} 30%{transform:translate(10px,-5px)}
    52%{transform:translate(-11px,2px);clip-path:inset(10% 0 55% 0)} 53.5%{transform:translate(6px,-3px);clip-path:inset(0)}
    70%{transform:translate(8px,-4px)} 88%{transform:translate(-8px,6px);clip-path:inset(65% 0 0 0)} 89.5%{transform:translate(6px,-3px);clip-path:inset(0)}}
  /* 로그인 로고: SWAP 글리치 ↔ SWING 애니메이션(투명 배경 webp) 0.4초씩 교대 (.glitch.swing 일 때 SWING) */

  .lcard{position:relative;flex:0 0 auto;width:100%;max-width:340px;padding:26px 22px 22px;border-radius:28px;background:rgba(22,17,34,.62);border:1px solid rgba(255,255,255,.13);
         box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);text-align:center;

  @keyframes lcardin{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
  .lcard .lt{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.25} .lcard .lt em{font-style:normal;color:#a56bff}

  .srvpick{display:flex;justify-content:center;gap:34px}

  .srvpick button::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2.5px;border-radius:2px;background:#fff;transform:scaleX(0);transition:transform .3s var(--spring)}
  .srvpick button.on{color:#fff;font-weight:900;transform:scale(1.06)} .srvpick button.on::after{transform:scaleX(1)}
  .lcard .ll{margin:16px 0 8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.62);letter-spacing:.3px}
  .lcard .linput{width:100%;box-sizing:border-box;margin-top:22px;padding:12px 4px 10px;border:0;border-bottom:2px solid rgba(255,255,255,.55);border-radius:0;background:transparent;color:#fff;outline:none;
         font-family:ui-monospace,Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:8px;text-align:center;text-transform:uppercase;transition:border-color .15s}

  .lcard .btn{margin:18px auto 0;width:auto;min-width:112px;padding:10px 26px;font-size:22px;font-weight:900;letter-spacing:-.3px;border-radius:12px;background:transparent;color:#fff;box-shadow:none} .lcard .btn:active{transform:scale(.94)} .lcard .btn:disabled{opacity:.6}
  .lcard .lauto{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;user-select:none}
  .lcard .lauto input{position:absolute;opacity:0;width:0;height:0}
  .lcard .lauto i{width:20px;height:20px;border-radius:7px;border:1.5px solid rgba(255,255,255,.45);background:rgba(0,0,0,.25);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .lcard .lauto i::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0;transition:opacity .15s}
  .lcard .lauto input:checked+i{background:var(--p);border-color:var(--p)} .lcard .lauto input:checked+i::after{opacity:1}
  .lcard .lerr{min-height:20px;margin-top:12px;font-size:13.5px;font-weight:600;color:#ff8fa3}
  .lcard.shake{animation:shake .5s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  .lver{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.35)}
  /* 토글 스위치 */
  .sw{position:relative;flex:0 0 auto;width:48px;height:28px;border-radius:999px;background:#d9dbe3;border:0;padding:0;transition:background .2s;cursor:pointer}

  .crow .cn{flex:1;min-width:0} .crow .cn .input{padding:10px 12px;font-size:15px} .crow .cm{font-size:11.5px;color:var(--muted);margin-top:3px;padding-left:2px}
  @media print{
    @page{size:A4 portrait;margin:0} html,body{overflow:visible;height:auto;background:#fff}

  }

<body>
<div class="login" id="login" style="display:none">

    <div class="srvpick" id="srvpick"><button type="button" data-srv="swap" onclick="pickServer('swap')">SWAP</button><button type="button" data-srv="swing" onclick="pickServer('swing')">SWING</button></div>
    <input class="linput" id="lcode" maxlength="8" placeholder="접속 코드 입력" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="latin">

  <div class="lver" id="lver"></div>
</div>

  var maxv=Math.max.apply(null,items.map(function(i){return i.to;}));

var hDepth=0, ignorePop=0;

/* ================= SWING 서버 (S&P 워크 앱 이식) ================= */
/* 원본 안드로이드 앱 "S&P 워크"(com.mineo.qrserial v3.4)의 기능을 그대로 옮김:
   배터리 사진(수량 스탬프) · 차량 사진(차량번호 스탬프) · QR 스캔(시리얼 기록) · 사진모음(Slack 공유) · 설정.
   저장: 설정/QR 기록/사진 목록은 localStorage(swapc:sw_*), 사진 원본·썸네일은 IndexedDB(swing-photos). */
var SW_MAX_PHOTOS=100;   // 앱 안에 두는 사진 최대 장수 (넘으면 오래된 것부터 자동 삭제)
var SW_DEFAULT_VEHICLES=['89도3102','84가1708','87모1064','89노4399','94수6382','85서3703','95부4520','92부0447'];
function swPrefs(){ var p=lsGet('sw_settings')||{}; return { resetCounts:(p.resetCounts!==false), vehicles:(p.vehicles&&p.vehicles.length)?p.vehicles:SW_DEFAULT_VEHICLES.slice(),
  chBattery:(p.chBattery!==undefined)?p.chBattery:'#배터리입출고', chVehicle:(p.chVehicle!==undefined)?p.chVehicle:'#차량관리', keepScreen:!!p.keepScreen }; }
function swPrefsSave(p){ lsSet('sw_settings',p); }
function swNormCh(raw){ var t=String(raw||'').trim(); if(!t) return ''; return t.charAt(0)==='#'?t:'#'+t; }
function swQrList(){ return lsGet('sw_qr')||[]; } function swQrSave(l){ lsSet('sw_qr',l); }
function swPhotos(){ return lsGet('sw_photos')||[]; } function swPhotosSave(l){ lsSet('sw_photos',l); }
function pad2(n){ return ('0'+n).slice(-2); }
function swFmtStamp(ts){ var d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' ('+'일월화수목금토'[d.getDay()]+') '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function swFmtShort(ts){ var d=new Date(ts); return pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function swFmtSec(ts){ var d=new Date(ts); return swFmtShort(ts)+':'+pad2(d.getSeconds()); }
function swFileName(ts){ var d=new Date(ts); return 'SNP_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'.jpg'; }
/* 진동·소리 (원본 Haptics / ToneGenerator) */
function swTick(){ haptic(20); } function swSuccess(){ haptic(30); } function swWarn(){ haptic([150,120,150]); }
var swAC=null; function swBeep(freq,ms){ try{ swAC=swAC||new (window.AudioContext||window.webkitAudioContext)(); var o=swAC.createOscillator(), g=swAC.createGain(); o.frequency.value=freq; o.type='square'; g.gain.value=.08; o.connect(g); g.connect(swAC.destination); o.start(); o.stop(swAC.currentTime+ms/1000); }catch(e){} }
/* 화면 켜둠 */
var swWakeLock=null; function swWake(on){ try{ if(on){ if(!swWakeLock&&navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ swWakeLock=l; }).catch(function(){}); } else if(swWakeLock){ swWakeLock.release().catch(function(){}); swWakeLock=null; } }catch(e){} }
/* IndexedDB: 사진 원본(jpg)·썸네일 */
var swDB=null;
function swIDB(){ return new Promise(function(res,rej){ if(swDB) return res(swDB); var r=indexedDB.open('swing-photos',1); r.onupgradeneeded=function(){ r.result.createObjectStore('photos'); }; r.onsuccess=function(){ swDB=r.result; res(swDB); }; r.onerror=function(){ rej(r.error); }; }); }
function swPut(k,v){ return swIDB().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction('photos','readwrite'); t.objectStore('photos').put(v,k); t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; }); }); }
function swGet(k){ return swIDB().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction('photos','readonly'); var q=t.objectStore('photos').get(k); q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ rej(q.error); }; }); }); }
function swDel(k){ return swIDB().then(function(db){ return new Promise(function(res){ var t=db.transaction('photos','readwrite'); t.objectStore('photos').delete(k); t.objectStore('photos').delete('thumb_'+k); t.oncomplete=function(){ res(); }; t.onerror=function(){ res(); }; }); }); }

/* ---- SerialExtractor (원본 규칙 그대로) ---- */
var SW_SERIAL_KEYS=['code','serial','sn','qrcode','qr','deviceid','imei'], SW_WRAP_KEYS=['link','url','target','redirect'];
var SW_STOP={RIDE:1,SCAN:1,S:1,R:1,QR:1,APP:1,HOME:1,INDEX:1,START:1,OPEN:1,DOWNLOAD:1}; var SW_SHAPE=/^[A-Z0-9][A-Z0-9_-]{3,23}$/;
function swUrlDecode(v){ try{ return decodeURIComponent(String(v).replace(/\+/g,'%20')); }catch(e){ return v; } }
function swParseQuery(text){ var i=text.indexOf('?'); if(i<0) return {}; var q=text.slice(i+1); var h=q.indexOf('#'); if(h>=0) q=q.slice(0,h); var out={}; if(!q) return out;
  q.split('&').forEach(function(p){ var e=p.indexOf('='); var k=(e<0?'':p.slice(0,e)).toLowerCase().trim(), v=(e<0?'':p.slice(e+1)).trim(); if(k&&v) out[k]=v; }); return out; }
function swLastSeg(text){ var t=text.split('?')[0].split('#')[0].replace(/\/+$/,''); var s=t.slice(t.lastIndexOf('/')+1); return s||null; }
function swSanitize(v){ var d=swUrlDecode(v).trim(); var s=''; for(var i=0;i<d.length;i++){ var c=d[i]; if(/[\p{L}\p{N}]/u.test(c)||c==='-'||c==='_') s+=c; } return s?s.toUpperCase():null; }
function swLooksSerial(v){ return SW_SHAPE.test(v)&&!SW_STOP[v]; }
function swExtract(raw,depth){ depth=depth||0; var text=String(raw||'').trim(); if(!text) return null; var params=swParseQuery(text);
  if(depth<3){ for(var i=0;i<SW_WRAP_KEYS.length;i++){ var w=params[SW_WRAP_KEYS[i]]; if(w){ var r=swExtract(swUrlDecode(w),depth+1); if(r) return r; } } }
  for(var j=0;j<SW_SERIAL_KEYS.length;j++){ var sv=params[SW_SERIAL_KEYS[j]]; if(sv){ var s=swSanitize(sv); if(s) return s; } }
  var seg=swLastSeg(text); var cand=seg?swSanitize(seg):null; if(cand&&swLooksSerial(cand)) return cand;
  var ks=Object.keys(params); for(var k=0;k<ks.length;k++){ var c2=swSanitize(params[ks[k]]); if(c2&&swLooksSerial(c2)) return c2; }
  return cand; }

/* ---- 사진 스탬프 (PhotoStamper 그대로: 좌하단, 흰 글자 + 검정 외곽선) ---- */
function swBatteryLines(name,ts,s9,w9,i9on,i9){ var L=[String(name||'').trim()||'이름 없음', swFmtStamp(ts), 'S9  '+s9+'개', 'W9  '+w9+'개']; if(i9on) L.push('I9  '+i9+'개'); return L; }
function swVehicleLines(name,ts,veh){ return [String(name||'').trim()||'이름 없음', swFmtStamp(ts), String(veh||'').trim()||'차량 미선택']; }
function swStamp(cv,lines){ var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height; var short=Math.min(W,H); var margin=.035*short; var size=.065*short;
  ctx.font='bold '+size+'px sans-serif'; var widest=0; lines.forEach(function(l){ widest=Math.max(widest,ctx.measureText(l).width); });
  var maxW=W*.8-margin; if(widest>maxW){ size*=maxW/widest; ctx.font='bold '+size+'px sans-serif'; }
  var lh=1.28*size; var m=ctx.measureText('Ag'); var desc=(m.actualBoundingBoxDescent||size*.22);
  var y=H-margin-desc-(lines.length-1)*lh; ctx.lineJoin='round'; ctx.lineWidth=.13*size; ctx.strokeStyle='#000'; ctx.fillStyle='#fff'; ctx.textBaseline='alphabetic';
  lines.forEach(function(l){ ctx.strokeText(l,margin,y); ctx.fillText(l,margin,y); y+=lh; }); }

/* ---- 카메라 공통 ---- */
var swStream=null, swTrack=null;
function swCamStart(vid,ideal){ return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:ideal||1920},height:{ideal:1080}},audio:false}).then(function(st){ swStream=st; swTrack=st.getVideoTracks()[0]; vid.srcObject=st; vid.setAttribute('playsinline',''); vid.muted=true; return vid.play().catch(function(){}); }); }
function swCamStop(){ if(swStream){ swStream.getTracks().forEach(function(t){ t.stop(); }); } swStream=null; swTrack=null; swWake(false); }
function swTorchOK(){ try{ return !!(swTrack&&swTrack.getCapabilities&&swTrack.getCapabilities().torch); }catch(e){ return false; } }
function swTorch(btn,offLabel,onLabel){ if(!swTrack) return; var on=btn.classList.toggle('on'); swTrack.applyConstraints({advanced:[{torch:on}]}).catch(function(){ btn.classList.remove('on'); toast('이 기기는 플래시를 지원하지 않습니다'); }); btn.textContent=on?onLabel:offLabel; }
function swCamErr(err){ var n=err&&err.name||''; return n==='NotAllowedError'?'카메라 권한이 필요합니다':(n==='NotFoundError'?'이 기기에 카메라가 없어요.':'카메라를 열 수 없습니다: '+n); }
